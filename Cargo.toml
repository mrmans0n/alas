[package]
name = "alas"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
indexmap = { version = "2", features = ["serde"] }
portable-pty = "0.8"
pulldown-cmark = "0.12"
agent-client-protocol = "0.11.1"
keyring = { version = "3", default-features = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# GPUI is the Rust UI framework used by Zed. If crates.io does not have the
# needed version, switch this dependency to Zed's Git repository during this task.
gpui = { version = "0.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"

# libghostty-rs currently exposes Ghostty VT bindings through libghostty-vt.
# Alas keeps this behind src/terminal/ghostty_adapter.rs. If the project adds
# higher-level PTY/process crates, add them here without changing TerminalBackend.
libghostty-vt = { version = "0.1", optional = true }
tree-sitter-highlight = "0.25.10"
tree-sitter-rust = "0.24.2"
tree-sitter-json = "0.24.8"

[features]
default = ["ghostty-vt"]
ghostty-vt = ["dep:libghostty-vt"]

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[workspace]
members = ["xtask"]
default-members = [".", "xtask"]
resolver = "3"
