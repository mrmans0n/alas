name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-test:
    # macos-26 GA on GitHub-hosted runners ships Xcode 26 — matches what
    # Ghostty's main HEAD requires (per ThirdParty/ghostty/HACKING.md).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Print toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install xcodegen + zig@0.15
        # Homebrew's zig@0.15 ships the patch for Zig 0.15.2 + Xcode 26.4
        # linker bug Ghostty's HACKING.md describes. Vanilla Zig 0.15.2 does not.
        run: brew install xcodegen zig@0.15

      - name: Compute Ghostty cache key inputs
        # Submodules track their HEAD via .git/modules/... in the parent repo, so
        # `ThirdParty/ghostty/.git` is a *file* (not a dir) and hashFiles can't
        # follow it. Dump the submodule SHA + script hash into a small file we
        # can feed to hashFiles. Re-runs whenever the pinned commit moves.
        run: |
          git -C ThirdParty/ghostty rev-parse HEAD > .ghostty-pin
          shasum scripts/build-ghostty.sh >> .ghostty-pin
          cat .ghostty-pin

      - name: Cache Ghostty build outputs
        # Cold zig builds are ~20–30 minutes. Cache the xcframework + zig caches
        # keyed by the submodule commit + the build script so we only rebuild
        # when anything load-bearing actually changes.
        uses: actions/cache@v4
        with:
          path: |
            .build/ghostty
          key: ghostty-${{ runner.os }}-${{ hashFiles('.ghostty-pin') }}

      - name: Build Ghostty xcframework
        # xcodebuild validates the GhosttyKit.xcframework dependency at the
        # "create build description" stage, BEFORE running preBuildScripts.
        # If the xcframework doesn't already exist on disk, the build fails
        # before our pre-build script ever gets a chance to produce it. So
        # we run the script as its own CI step, ahead of xcodebuild.
        run: ./scripts/build-ghostty.sh

      - name: Generate Xcode project
        run: xcodegen

      - name: Build
        run: xcodebuild -project Alas.xcodeproj -scheme Alas -destination 'platform=macOS' build

      - name: Test
        run: xcodebuild -project Alas.xcodeproj -scheme Alas -destination 'platform=macOS' test
