name: Build

# Skip the whole workflow when a push or PR only touches files that no CI job
# builds, tests, or reads: docs, agent skill/config directories, marketing art,
# and the other workflows. `paths` is used instead of `paths-ignore` because
# only `paths` supports re-including a subtree after excluding its parent
# (`.alas/scripts/**` is exercised by the alas-build harness). Keep both event
# lists identical; scripts/tests/ci-workflow enforces that. No branch protection
# requires these checks, so a skipped run leaves PRs mergeable.
on:
  push:
    branches:
      - main
      - master
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      - "!art/**"
      - "!assets/**"
      - "!renovate.json"
      - "!.agents/**"
      - "!.claude/**"
      - "!.github/workflows/nightly.yml"
      - "!.github/workflows/release.yml"
      - "!.github/workflows/update-cask.py"
      - "!.alas/**"
      - ".alas/scripts/**"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      - "!art/**"
      - "!assets/**"
      - "!renovate.json"
      - "!.agents/**"
      - "!.claude/**"
      - "!.github/workflows/nightly.yml"
      - "!.github/workflows/release.yml"
      - "!.github/workflows/update-cask.py"
      - "!.alas/**"
      - ".alas/scripts/**"

# Cancel superseded runs on the same ref (e.g. force-push to a PR branch).
# Saves CI minutes and frees the macos-26 queue when iterating fast.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # macos-26 GA on GitHub-hosted runners ships Xcode 26 — matches what
    # Ghostty's main HEAD requires (per ThirdParty/ghostty/HACKING.md).
    runs-on: macos-26
    # Build once; test runners queue only after products and the plan are published.
    timeout-minutes: 110
    # Block any git operation from prompting (credential helper, SSH key
    # lookup, etc.). Without these, GitServiceTests.suggestNameFromSshRemote
    # — which sets a `git@github.com:...` remote — hung indefinitely on
    # macos-26 (CI has no SSH key configured; git/ssh blocks waiting for
    # one). Setting GIT_TERMINAL_PROMPT=0 + a no-op GIT_ASKPASS makes any
    # interactive request return immediately.
    env:
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: "/usr/bin/true"
      SSH_ASKPASS: "/usr/bin/true"
      DISPLAY: ":0"
      # Disable git pager. macos-26's git misdetects "no tty" in some
      # subprocess contexts and tries to spawn `less`, which then blocks
      # forever waiting for stdin. Observed hanging WorktreeServiceTests'
      # `git branch --list` after `git branch -d`.
      GIT_PAGER: "cat"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Print toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Configure git author identity for tests
        # WorktreeServiceTests / GitServiceTests / ProjectsManagerTests run
        # `git commit --allow-empty` against ephemeral repos. Fresh runners
        # have no git identity, which causes commit to fail (and in a few
        # observed cases hang interacting with the credential helper).
        # Set throwaway values globally — only used by these tests.
        run: |
          git config --global user.email "ci@alas.invalid"
          git config --global user.name "Alas CI"
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
          # macOS system gitconfig sets `credential.helper = osxkeychain` by
          # default. On headless macos-26 runners the keychain isn't unlocked,
          # so any git op against an HTTPS remote (even `git remote add`) can
          # block waiting for the keychain agent. Observed
          # GitServiceTests.suggestNameFromHttpsRemote hanging the suite for
          # 8min after our SSH-prompt fixes already landed. Disable all
          # credential helpers (system + global) for the test run.
          git config --global --unset-all credential.helper || true
          git config --global credential.helper ""

      - name: Install xcodegen + zig@0.15 + SwiftFormat
        # Homebrew's zig@0.15 ships the patch for Zig 0.15.2 + Xcode 26.4
        # linker bug Ghostty's HACKING.md describes. Vanilla Zig 0.15.2 does not.
        run: brew install xcodegen zig@0.15 swiftformat ripgrep

      - name: Check formatting
        run: swiftformat Alas AlasTests --lint --reporter github-actions-log

      - name: Test Swift test inventory harness
        run: bash scripts/tests/swift-test-inventory/run.sh

      - name: Test build-ghostty.sh harness
        run: bash scripts/tests/build-ghostty/run.sh

      - name: Test build-alas-helper.sh harness
        run: bash scripts/tests/build-alas-helper/run.sh

      - name: Test build-alas-cli.sh harness
        run: bash scripts/tests/build-alas-cli/run.sh

      # These runners exercise Apple-target selection, lipo/install-name
      # behavior, resource signing, and Xcode DerivedData metadata.
      - name: Test build-zmx harness
        run: bash scripts/tests/build-zmx/run.sh

      - name: Test build-fff harness
        if: ${{ !cancelled() }}
        run: bash scripts/tests/build-fff/run.sh

      - name: Test build-treesitter-pack harness
        if: ${{ !cancelled() }}
        run: bash scripts/tests/build-treesitter-pack/run.sh

      - name: Test embed-ghostty-resources harness
        if: ${{ !cancelled() }}
        run: bash scripts/tests/embed-ghostty-resources/run.sh

      - name: Test Xcode state harness
        if: ${{ !cancelled() }}
        run: bash scripts/tests/xcode-state/run.sh

      - name: Test Alas build harness
        if: ${{ !cancelled() }}
        run: bash scripts/tests/alas-build/run.sh

      - name: Compute Ghostty cache key inputs
        # Use the script's authoritative fingerprint so the Actions key tracks
        # every input that can change the produced artifact.
        run: |
          ALAS_GHOSTTY_TARGET_ARCH=arm64 ./scripts/build-ghostty.sh --print-fingerprint > .ghostty-pin
          cat .ghostty-pin

      - name: Restore Ghostty cache
        # Restore the shared arm64 cache. `build-ghostty.sh` validates the
        # restored entry and populates `.build/ghostty`. Split restore + save
        # (Option B): the combined `actions/cache@v4` only
        # saves at end-of-job on success. When build/test fails or is canceled,
        # we lose the freshly-built xcframework and the next CI run pays the
        # full 20–30 min cold zig build again. With explicit restore + save,
        # the xcframework is cached the instant it's produced so subsequent
        # runs (including failed-and-retry) get a warm cache.
        id: ghostty-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/Alas/GhosttyKit/arm64
          key: ghostty-${{ runner.os }}-arm64-${{ hashFiles('.ghostty-pin') }}
          restore-keys: |
            ghostty-${{ runner.os }}-arm64-

      - name: Build Ghostty xcframework
        # xcodebuild validates the GhosttyKit.xcframework dependency at the
        # "create build description" stage, BEFORE running preBuildScripts.
        # If the xcframework doesn't already exist on disk, the build fails
        # before our pre-build script ever gets a chance to produce it. So
        # we run the script as its own CI step, ahead of xcodebuild.
        env:
          ALAS_GHOSTTY_TARGET_ARCH: arm64
          ALAS_GHOSTTY_CACHE_KEEP: 1
        run: ./scripts/build-ghostty.sh

      - name: Save Ghostty cache
        # Save immediately on success of the build script, BEFORE the rest of
        # the job has a chance to fail. `if: always()` here would also fire
        # on script failure (saving an incomplete tree); restrict to success.
        # `cache-hit != 'true'` skips a no-op save when restore already hit.
        if: success() && steps.ghostty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/Alas/GhosttyKit/arm64
          key: ${{ steps.ghostty-cache.outputs.cache-primary-key }}

      - name: Compute prebuilt tools cache key inputs
        # Same pin-file pattern as .ghostty-pin: the fingerprint inputs the
        # build scripts consult but hashFiles can't reach (submodule HEADs,
        # the zig binary) get dumped into a small file we can hash.
        # The zig *binary content* hash (not `zig version`) matters because
        # build-zmx.sh hashes the binary into its fingerprint — a Homebrew
        # bottle rebuild with an unchanged version string must still change
        # the key. Helper's rust toolchain is pinned inside its script, so
        # the script hash covers it.
        run: |
          git -C ThirdParty/zmx rev-parse HEAD > .tools-pin
          {
            git -C ThirdParty/fff rev-parse HEAD
            git rev-parse HEAD:AlasHelper
            git rev-parse HEAD:AlasCLI
            git rev-parse HEAD:ThirdParty/treesitter-pack
            shasum scripts/build-zmx.sh scripts/build-fff.sh scripts/build-alas-helper.sh scripts/build-alas-cli.sh scripts/build-treesitter-pack.sh
            shasum -a 256 "$(brew --prefix zig@0.15)/bin/zig"
          } >> .tools-pin
          cat .tools-pin

      - name: Restore prebuilt tools cache
        # zmx / fff / Alas Helper / Alas CLI artifacts combined in one entry — each is
        # a few MB, and only install outputs + fingerprint markers are
        # cached (no zig/cargo intermediates). The key is an optimization
        # hint only: each script re-validates restored artifacts against its
        # own fingerprint (submodule SHA + dirt + arch + toolchain + script
        # hash), so a stale restore-keys fallback can never ship a wrong
        # binary — the changed component rebuilds while the rest fast-path.
        # zmx's macOS slice fast-paths off the *host* cache
        # (~/Library/Caches/Alas/zmx), not the worktree output, hence that
        # path; the Linux slices and fff/helper check worktree markers.
        id: tools-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/Alas/zmx
            .build/zmx/linux-*/install
            .build/zmx/linux-*/fingerprint
            .build/fff/*/install
            .build/fff/*/fingerprint
            .build/fff/include
            .build/treesitter-pack/*/install
            .build/treesitter-pack/*/fingerprint
            .build/treesitter-pack/include
            .build/alas-helper/*/release/alas-helper
            .build/alas-helper/fingerprint
            .build/alas-cli/*/release/alas
            .build/alas-cli/fingerprint
          key: tools-${{ runner.os }}-arm64-${{ hashFiles('.tools-pin') }}
          restore-keys: |
            tools-${{ runner.os }}-arm64-

      - name: Prebuild zmx + fff + tree-sitter pack + Alas Helper + Alas CLI
        # These normally run as pre-build script phases *inside* xcodebuild,
        # where a cold run buries ~11 min of zig/cargo work inside the build
        # step and a later failure throws it away. Run them as their own
        # step so the artifacts can be cached the moment they exist; the
        # in-xcodebuild phases then fast-path in seconds.
        run: |
          ./scripts/build-zmx.sh
          ./scripts/build-fff.sh
          ./scripts/build-treesitter-pack.sh
          ./scripts/build-alas-helper.sh
          ./scripts/build-alas-cli.sh

      - name: Save prebuilt tools cache
        # Save immediately after the prebuild step succeeds, BEFORE
        # xcodebuild/tests get a chance to fail — same split restore/save
        # rationale as the Ghostty cache above.
        if: success() && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Caches/Alas/zmx
            .build/zmx/linux-*/install
            .build/zmx/linux-*/fingerprint
            .build/fff/*/install
            .build/fff/*/fingerprint
            .build/fff/include
            .build/treesitter-pack/*/install
            .build/treesitter-pack/*/fingerprint
            .build/treesitter-pack/include
            .build/alas-helper/*/release/alas-helper
            .build/alas-helper/fingerprint
            .build/alas-cli/*/release/alas
            .build/alas-cli/fingerprint
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

      - name: Generate Xcode project
        run: xcodegen

      - name: Compute Xcode package cache key inputs
        run: |
          xcodebuild -version > .xcode-cache-toolchain
          swift --version >> .xcode-cache-toolchain
          cat .xcode-cache-toolchain

      - name: Restore SwiftPM package cache
        id: swiftpm-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/xcode/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.xcode-cache-toolchain', 'project.yml', 'Alas.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve SwiftPM packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Alas.xcodeproj \
            -scheme Alas \
            -clonedSourcePackagesDirPath .build/xcode/SourcePackages

      - name: Save SwiftPM package cache
        if: success() && steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/xcode/SourcePackages
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

      - name: Identify compilation cache compatibility
        run: |
          cp .xcode-cache-toolchain .xcode-compilation-cache-toolchain
          {
            sw_vers
            xcode-select -p
            xcrun --sdk macosx --show-sdk-path
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-build-version
            printf '%s\n' "$GITHUB_WORKSPACE" 'Debug arm64 macOS unsigned'
          } >> .xcode-compilation-cache-toolchain
          cat .xcode-compilation-cache-toolchain

      - name: Restore compilation cache
        id: compilation-cache
        timeout-minutes: 5
        uses: actions/cache/restore@v6
        with:
          # Compiler content-addressed storage only; Xcode rebuilds its graph
          # against this checkout and verifies the actual compilation inputs.
          path: .build/xcode/CompilationCache.noindex
          key: swift-cas-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.xcode-compilation-cache-toolchain', 'project.yml', '.github/workflows/build.yml', 'Alas.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-cas-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.xcode-compilation-cache-toolchain', 'project.yml', '.github/workflows/build.yml', 'Alas.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-

      - name: Build for testing
        timeout-minutes: 30
        # Splitting build/test into `build-for-testing` + `test-without-building`
        # avoids the lsregister/CoreServices hang we observed locally and on CI
        # when xcodebuild's `test` action re-validates the build description and
        # registers the test host with LaunchServices. Same artifacts, no
        # mid-test re-link.
        # `-skipMacroValidation` skips the first-run "trust this Swift macro"
        # prompt that on macos-26 stalls headless builds. CODE_SIGNING_*=NO and
        # empty CODE_SIGN_IDENTITY drop the codesign step from the build graph
        # — codesign on macos-26 has occasionally blocked on keychain access in
        # CI with no signing identity present (per supacode's CI workflow).
        run: |
          python3 scripts/swift_build_metrics.py run --output .build/xcode/build-metrics -- \
            xcodebuild -project Alas.xcodeproj -scheme Alas -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/xcode/DerivedData \
            -clonedSourcePackagesDirPath .build/xcode/SourcePackages \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            COMPILATION_CACHE_CAS_PATH="$GITHUB_WORKSPACE/.build/xcode/CompilationCache.noindex" \
            -resultBundlePath .build/xcode/build-metrics/build.xcresult \
            -showBuildTimingSummary \
            build-for-testing

      - name: Summarize Swift compilation
        if: ${{ !cancelled() && hashFiles('.build/xcode/build-metrics/build.xcresult/Info.plist') != '' }}
        timeout-minutes: 2
        run: |
          python3 scripts/swift_build_metrics.py report --output .build/xcode/build-metrics \
            --result .build/xcode/build-metrics/build.xcresult

      - name: Upload Swift build measurements
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: swift-build-metrics-${{ github.run_attempt }}
          path: .build/xcode/build-metrics
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload compact Swift build summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-build-summary-${{ github.run_attempt }}
          path: |
            .build/xcode/build-metrics/run.json
            .build/xcode/build-metrics/summary.json
          if-no-files-found: warn

      - name: Locate compiled test plan
        run: |
          xctestrun_count="$(find .build/xcode/DerivedData/Build/Products -name '*.xctestrun' -type f | wc -l | tr -d ' ')"
          xctestrun="$(find .build/xcode/DerivedData/Build/Products -name '*.xctestrun' -type f -print -quit)"
          if [[ "$xctestrun_count" -ne 1 ]]; then
            printf 'Expected one xctestrun file, found %s\n' "$xctestrun_count" >&2
            find .build/xcode/DerivedData/Build/Products -name '*.xctestrun' -type f >&2
            exit 1
          fi
          printf 'SWIFT_TEST_XCTESTRUN=%s/%s\n' "$GITHUB_WORKSPACE" "$xctestrun" >> "$GITHUB_ENV"

      # Xcode enumerates the compiled tests. Unlisted tests run automatically;
      # explicit execution requirements and exclusions are validated against it.
      - name: Discover and assign Swift tests
        id: swift-inventory
        timeout-minutes: 3
        run: python3 scripts/ci_swift_tests.py plan

      - name: Package compiled Swift test products
        timeout-minutes: 5
        run: |
          mkdir -p .build/xcode/test-artifact
          {
            xcodebuild -version
            printf 'macOS '
            sw_vers -productVersion
            uname -m
          } > .build/xcode/test-artifact/toolchain.txt
          tar -czf .build/xcode/swift-test-products.tgz \
            -C .build/xcode \
            DerivedData/Build/Products \
            test-artifact/toolchain.txt
          du -h .build/xcode/swift-test-products.tgz

      - name: Upload Swift test plan
        uses: actions/upload-artifact@v7
        with:
          name: swift-test-plan-${{ github.run_attempt }}
          path: |
            .build/xcode/results/plan.json
            .build/xcode/results/enumeration.json
            .build/xcode/results/enumeration.log
          retention-days: 1
          if-no-files-found: error

      - name: Upload compiled Swift test products
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: swift-test-products-${{ github.run_attempt }}
          path: .build/xcode/swift-test-products.tgz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Measure compilation cache size
        run: du -sk .build/xcode/CompilationCache.noindex

      - name: Save compilation cache
        if: success() && steps.compilation-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: actions/cache/save@v6
        with:
          path: .build/xcode/CompilationCache.noindex
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

  swift-tests:
    name: Swift tests (shard ${{ matrix.shard }})
    # Reserve macOS runners only when compiled products are ready.
    needs: build-test
    permissions:
      contents: read
      actions: read
    runs-on: macos-26
    # Ordinary and isolated invocations retain their individual deadlines.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: "/usr/bin/true"
      SSH_ASKPASS: "/usr/bin/true"
      DISPLAY: ":0"
      GIT_PAGER: "cat"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Configure test runner
        run: |
          git config --global user.email "ci@alas.invalid"
          git config --global user.name "Alas CI"
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
          git config --global --unset-all credential.helper || true
          git config --global credential.helper ""

      - name: Install test runtime tools
        # ContentSearcherTests require rg and treat a missing binary as a
        # runtime skip, which the coverage audit correctly rejects.
        run: brew install ripgrep

      - name: Download compiled Swift test products
        uses: actions/download-artifact@v8
        with:
          name: swift-test-products-${{ github.run_attempt }}
          path: .build/xcode/artifact

      - name: Download Swift test plan
        uses: actions/download-artifact@v8
        with:
          name: swift-test-plan-${{ github.run_attempt }}
          path: .build/xcode/results

      - name: Restore and validate compiled test products
        run: |
          tar -xzf .build/xcode/artifact/swift-test-products.tgz -C .build/xcode
          {
            xcodebuild -version
            printf 'macOS '
            sw_vers -productVersion
            uname -m
          } > .build/xcode/test-artifact/current-toolchain.txt
          diff -u .build/xcode/test-artifact/toolchain.txt .build/xcode/test-artifact/current-toolchain.txt
          xctestrun_count="$(find .build/xcode/DerivedData/Build/Products -name '*.xctestrun' -type f | wc -l | tr -d ' ')"
          xctestrun="$(find .build/xcode/DerivedData/Build/Products -name '*.xctestrun' -type f -print -quit)"
          if [[ "$xctestrun_count" -ne 1 ]]; then
            printf 'Expected one xctestrun file, found %s\n' "$xctestrun_count" >&2
            exit 1
          fi
          printf 'SWIFT_TEST_XCTESTRUN=%s/%s\n' "$GITHUB_WORKSPACE" "$xctestrun" >> "$GITHUB_ENV"

      - name: Run measured Swift shard
        run: python3 scripts/ci_swift_tests.py run-shard --shard ${{ matrix.shard }}

      - name: Upload Swift shard coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-test-reports-${{ github.run_attempt }}-${{ matrix.shard }}
          path: .build/xcode/results/*.report.json
          if-no-files-found: warn

      - name: Upload Swift shard diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-test-results-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            .build/xcode/results/*.xcresult
            .build/xcode/results/*.log
            .build/xcode/results/*.report.json
            .build/xcode/results/*.tests.json
          include-hidden-files: true
          if-no-files-found: warn

  swift-coverage:
    name: Swift coverage audit
    permissions:
      contents: read
      actions: read
    needs: [build-test, swift-tests]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download Swift test plan
        uses: actions/download-artifact@v8
        with:
          name: swift-test-plan-${{ github.run_attempt }}
          path: .build/xcode/results

      - name: Download every Swift shard coverage report
        uses: actions/download-artifact@v8
        with:
          pattern: swift-test-reports-${{ github.run_attempt }}-*
          path: .build/xcode/results/shards

      - name: Reconcile Swift coverage and publish timings
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_swift_tests.py summary

      - name: Require every Swift job to succeed
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build-test.result }}
          SHARD_RESULT: ${{ needs.swift-tests.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SHARD_RESULT" = success

      - name: Upload Swift coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-test-summary-${{ github.run_attempt }}
          path: |
            .build/xcode/results/summary.md
            .build/xcode/results/timings.json
          if-no-files-found: warn

      - name: Download compact Swift build summary
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: swift-build-summary-${{ github.run_attempt }}
          path: .build/xcode/build-summary

      - name: Report CI queue and execution timings
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_run_metrics.py

      - name: Upload CI timing report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-run-metrics-${{ github.run_attempt }}
          path: .build/xcode/run-metrics
          if-no-files-found: warn

  ci-workflow-contract:
    name: CI workflow contract
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Test CI workflow contract
        run: bash scripts/tests/ci-workflow/run.sh

      - name: Test Swift build measurements
        run: bash scripts/tests/swift-build-metrics/run.sh

  rust-tests:
    name: Rust tests (${{ matrix.project }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: AlasCLI
            toolchain: "1.98.1"
          - project: AlasHelper
            toolchain: "1.98.1"
          # tree-sitter-pack's build script declares this toolchain until the
          # crate owns a rust-toolchain.toml like the other first-party crates.
          - project: ThirdParty/treesitter-pack
            toolchain: "1.97.1"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.project }}/target
          key: rust-${{ runner.os }}-${{ matrix.project }}-${{ matrix.toolchain }}-${{ hashFiles('AlasCLI/Cargo.lock', 'AlasHelper/Cargo.lock', 'ThirdParty/treesitter-pack/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ matrix.project }}-${{ matrix.toolchain }}-

      - name: Install declared Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Run locked Rust tests
        working-directory: ${{ matrix.project }}
        run: rustup run ${{ matrix.toolchain }} cargo test --locked

  remote-web-tests:
    name: Remote web tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Test remote web changes
        run: bash scripts/tests/remote-web-changes/run.sh

      - name: Test remote web file browser
        if: ${{ !cancelled() }}
        run: bash scripts/tests/remote-web-file-browser/run.sh

      - name: Test remote web repo filter
        if: ${{ !cancelled() }}
        run: bash scripts/tests/remote-web-repo-filter/run.sh

      - name: Test remote web session ordering
        if: ${{ !cancelled() }}
        run: bash scripts/tests/remote-web-session-ordering/run.sh

      - name: Test remote web worktree creation
        if: ${{ !cancelled() }}
        run: bash scripts/tests/remote-web-worktree-creation/run.sh
