name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build, without the leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-app:
    # Same toolchain story as build.yml: macos-26 ships Xcode 26 (Ghostty's
    # main HEAD requirement). Submodule + zig@0.15 are required for the
    # Ghostty xcframework build.
    runs-on: macos-26
    # Each matrix leg has two notarytool --wait --timeout 30m calls (one .app
    # and one DMG). Worst-case notary time alone is 60 min if Apple's queue is
    # slow on both submissions. 90 min leaves headroom for build/package/upload.
    timeout-minutes: 90
    env:
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: "/usr/bin/true"
      SSH_ASKPASS: "/usr/bin/true"
      DISPLAY: ":0"
      GIT_PAGER: "cat"
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
          submodules: recursive

      - name: Configure headless git for package resolution
        run: |
          git config --global --unset-all credential.helper || true
          git config --global credential.helper ""

      - name: Install xcodegen + zig@0.15
        # Homebrew's zig@0.15 ships the patch for Zig 0.15.2 + Xcode 26.4
        # linker bug. See ThirdParty/ghostty/HACKING.md.
        run: brew install xcodegen zig@0.15 create-dmg

      - name: Test build-ghostty.sh harness
        run: bash scripts/tests/build-ghostty/run.sh

      - name: Compute Ghostty cache key inputs
        run: |
          ALAS_GHOSTTY_TARGET_ARCH="${{ matrix.arch }}" ./scripts/build-ghostty.sh --print-fingerprint > .ghostty-pin
          cat .ghostty-pin

      - name: Restore Ghostty cache
        # Release restores trusted cache entries only; the build script
        # validates them before populating this checkout.
        id: ghostty-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/Alas/GhosttyKit/${{ matrix.arch }}
          key: ghostty-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('.ghostty-pin') }}
          restore-keys: |
            ghostty-${{ runner.os }}-${{ matrix.arch }}-

      - name: Compute version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Stamp release version
        run: |
          ruby -e '
            version = ENV.fetch("VERSION")
            path = "project.yml"
            text = File.read(path)
            pattern = /(CFBundleShortVersionString:\s*)"[0-9]+\.[0-9]+\.[0-9]+"/
            count = text.scan(pattern).length
            abort("expected exactly one CFBundleShortVersionString in #{path}, got #{count}") unless count == 1
            File.write(path, text.gsub(pattern, "\\1\"#{version}\""))
          '
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" Alas/Resources/Info.plist

      - name: Generate project
        run: xcodegen

      - name: Compute Xcode package cache key inputs
        run: |
          xcodebuild -version > .xcode-cache-toolchain
          swift --version >> .xcode-cache-toolchain
          cat .xcode-cache-toolchain

      - name: Restore SwiftPM package cache
        id: swiftpm-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/xcode/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.xcode-cache-toolchain', 'project.yml', 'Alas.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Reset global SwiftPM repository cache
        # Xcode may consult ~/Library/Caches/org.swift.swiftpm even when
        # -clonedSourcePackagesDirPath points at the project-local cache.
        # Hosted runners can leave stale repository metadata there, which
        # makes package resolution fail or hang before the project cache is
        # populated. The runner is ephemeral, so clearing it is safe.
        run: rm -rf ~/Library/Caches/org.swift.swiftpm

      - name: Build Ghostty xcframework (${{ matrix.arch }})
        env:
          ALAS_GHOSTTY_TARGET_ARCH: ${{ matrix.arch }}
        run: ./scripts/build-ghostty.sh

      - name: Compute prebuilt tools cache key inputs
        # Same pin-file pattern as .ghostty-pin: the fingerprint inputs the
        # build scripts consult but hashFiles can't reach (submodule HEADs,
        # the zig binary) get dumped into a small file we can hash.
        # The zig *binary content* hash (not `zig version`) matters because
        # build-zmx.sh hashes the binary into its fingerprint — a Homebrew
        # bottle rebuild with an unchanged version string must still change
        # the key. Helper's rust toolchain is pinned inside its script, so
        # the script hash covers it.
        run: |
          git -C ThirdParty/zmx rev-parse HEAD > .tools-pin
          {
            git -C ThirdParty/fff rev-parse HEAD
            git rev-parse HEAD:AlasHelper
            git rev-parse HEAD:AlasCLI
            git rev-parse HEAD:ThirdParty/treesitter-pack
            shasum scripts/build-zmx.sh scripts/build-fff.sh scripts/build-alas-helper.sh scripts/build-alas-cli.sh scripts/build-treesitter-pack.sh
            shasum -a 256 "$(brew --prefix zig@0.15)/bin/zig"
          } >> .tools-pin
          cat .tools-pin

      - name: Restore prebuilt tools cache
        # zmx / fff / Alas Helper / Alas CLI artifacts combined in one entry — each is
        # a few MB, and only install outputs + fingerprint markers are
        # cached (no zig/cargo intermediates). The key is an optimization
        # hint only: each script re-validates restored artifacts against its
        # own fingerprint (submodule SHA + dirt + arch + toolchain + script
        # hash), so a stale restore-keys fallback can never ship a wrong
        # binary — the changed component rebuilds while the rest fast-path.
        # zmx's macOS slice fast-paths off the *host* cache
        # (~/Library/Caches/Alas/zmx), not the worktree output, hence that
        # path; the Linux slices and fff/helper check worktree markers.
        id: tools-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/Alas/zmx
            .build/zmx/linux-*/install
            .build/zmx/linux-*/fingerprint
            .build/fff/*/install
            .build/fff/*/fingerprint
            .build/fff/include
            .build/treesitter-pack/*/install
            .build/treesitter-pack/*/fingerprint
            .build/treesitter-pack/include
            .build/alas-helper/*/release/alas-helper
            .build/alas-helper/fingerprint
            .build/alas-cli/*/release/alas
            .build/alas-cli/fingerprint
          key: tools-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('.tools-pin') }}
          restore-keys: |
            tools-${{ runner.os }}-${{ matrix.arch }}-
            tools-${{ runner.os }}-arm64-

      - name: Prebuild zmx + fff + tree-sitter pack + Alas Helper + Alas CLI (${{ matrix.arch }})
        # These normally run as pre-build script phases *inside* xcodebuild,
        # where a cold run buries ~11 min of zig/cargo work inside the build
        # step and a later failure throws it away. Run them as their own
        # step so the artifacts can be cached the moment they exist; the
        # in-xcodebuild phases then fast-path in seconds. The arch overrides
        # mirror ALAS_GHOSTTY_TARGET_ARCH above so the x86_64 leg populates
        # the same per-arch paths the in-build phases will look up via
        # CURRENT_ARCH.
        env:
          ALAS_ZMX_TARGET_ARCH: ${{ matrix.arch }}
          ALAS_FFF_TARGET_ARCH: ${{ matrix.arch }}
          ALAS_TS_PACK_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          ./scripts/build-zmx.sh
          ./scripts/build-fff.sh
          ./scripts/build-treesitter-pack.sh
          ./scripts/build-alas-helper.sh
          ./scripts/build-alas-cli.sh

      - name: Resolve SwiftPM packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Alas.xcodeproj \
            -scheme Alas \
            -clonedSourcePackagesDirPath .build/xcode/SourcePackages

      - name: Build release app (${{ matrix.arch }})
        run: |
          xcodebuild -project Alas.xcodeproj -scheme Alas \
            -configuration Release \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath .build/xcode/SourcePackages \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -showBuildTimingSummary \
            build

      - name: Sign + notarize + staple .app (${{ matrix.arch }})
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD:   ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY:       ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID:        ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_PASSWORD:    ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          MACOS_NOTARY_TEAM_ID:         ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./scripts/sign-and-notarize.sh build/Build/Products/Release/Alas.app

      - name: Package .app — ${{ matrix.arch }} (zip + DMG)
        run: ./scripts/package-app.sh build/Build/Products/Release/Alas.app "Alas-${VERSION}-${{ matrix.arch }}"

      - name: Notarize + staple DMG (${{ matrix.arch }})
        env:
          MACOS_NOTARY_APPLE_ID:     ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          MACOS_NOTARY_TEAM_ID:      ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./scripts/notarize-and-staple-dmg.sh "build/Build/Products/Release/Alas-${VERSION}-${{ matrix.arch }}.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: alas-macos-${{ matrix.arch }}
          path: |
            build/Build/Products/Release/Alas-*-${{ matrix.arch }}.app.zip
            build/Build/Products/Release/Alas-*-${{ matrix.arch }}.dmg

      - name: Cleanup signing keychain
        if: always()
        run: ./scripts/cleanup-signing-keychain.sh

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: macos-app
    timeout-minutes: 10
    steps:
      - name: Checkout (for CHANGELOG.md)
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Compute version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: alas-macos-*

      - name: Extract release notes
        run: |
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { body = 1; next }
            body && index($0, "## [") == 1 { exit }
            body { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md" || {
            echo "::error::No CHANGELOG.md section found for v$VERSION"
            exit 1
          }

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            release-artifacts/**/Alas-*.app.zip
            release-artifacts/**/Alas-*.dmg

  update-homebrew:
    name: Update Homebrew Cask
    runs-on: ubuntu-latest
    needs: publish
    # Skip prereleases — those should ship a DMG for manual testing but
    # must not bump the cask that brew users follow. Tag-push releases are
    # stable by construction.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    steps:
      - name: Get version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Download DMGs and compute checksums
        run: |
          curl -fsSL "https://github.com/mrmans0n/alas/releases/download/v${VERSION}/Alas-${VERSION}-arm64.dmg" -o alas-arm64.dmg
          curl -fsSL "https://github.com/mrmans0n/alas/releases/download/v${VERSION}/Alas-${VERSION}-x86_64.dmg" -o alas-x86_64.dmg
          # Both shasum lines emit just the digest; the cut prevents stray
          # filename data from leaking into the env var (which update-cask.py
          # validates regex-strictly).
          echo "SHA_ARM=$(shasum -a 256 alas-arm64.dmg | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SHA_INTEL=$(shasum -a 256 alas-x86_64.dmg | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Checkout homebrew-tap
        run: |
          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/mrmans0n/homebrew-tap.git" homebrew-tap

      - name: Download update script
        # Pull the helper from this repo at the exact released tag so the
        # cask body is reproducible from the release ref alone.
        run: |
          curl -fsSL "https://raw.githubusercontent.com/mrmans0n/alas/v${VERSION}/.github/workflows/update-cask.py" -o update-cask.py

      - name: Update cask
        working-directory: homebrew-tap
        run: python3 ../update-cask.py

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- Casks/alas.rb)" ]; then
            echo "Cask already up to date"
            exit 0
          fi
          git add Casks/alas.rb
          git commit -m "Update alas cask to ${VERSION}"
          git push

      - name: Verify tap commit reached GitHub
        working-directory: homebrew-tap
        run: |
          expected_sha="$(git rev-parse HEAD)"
          for attempt in {1..30}; do
            remote_sha="$(git ls-remote https://github.com/mrmans0n/homebrew-tap.git refs/heads/main | cut -f1)"
            if [ "$remote_sha" = "$expected_sha" ]; then
              echo "homebrew-tap main is at $expected_sha"
              exit 0
            fi
            echo "Waiting for homebrew-tap main to reach $expected_sha (attempt $attempt, saw ${remote_sha:-none})"
            sleep 5
          done
          echo "::error::homebrew-tap main did not reach $expected_sha"
          exit 1

  verify-homebrew:
    name: Verify Homebrew Cask
    runs-on: macos-26
    needs: update-homebrew
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    steps:
      - name: Get version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Tap and validate published cask
        run: |
          brew update
          brew tap mrmans0n/tap https://github.com/mrmans0n/homebrew-tap.git
          tap_dir="$(brew --repo mrmans0n/tap)"
          git -C "$tap_dir" fetch origin main
          git -C "$tap_dir" reset --hard origin/main

          cask_version="$(brew cat --cask mrmans0n/tap/alas | awk '/^[[:space:]]*version / { gsub(/"/, "", $2); print $2; exit }')"
          if [ "$cask_version" != "$VERSION" ]; then
            echo "::error::Expected Homebrew cask version $VERSION, got ${cask_version:-none}"
            exit 1
          fi

          brew audit --cask mrmans0n/tap/alas
          brew fetch --cask mrmans0n/tap/alas --force --verbose
