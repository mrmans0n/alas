name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  macos-app:
    # Same toolchain story as build.yml: macos-26 ships Xcode 26 (Ghostty's
    # main HEAD requirement). Submodule + zig@0.15 are required for the
    # Ghostty xcframework build.
    runs-on: macos-26
    # Two notarytool --wait --timeout 30m calls in this job (one for the
    # .app, one for the .dmg) can each consume up to 30 min if Apple's
    # notary queue is slow, so worst-case notary time alone is 60 min.
    # 90 min leaves ~30 min headroom for build/package/upload even when
    # both notary submissions hit their per-call timeout.
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install xcodegen + zig@0.15
        # Homebrew's zig@0.15 ships the patch for Zig 0.15.2 + Xcode 26.4
        # linker bug. See ThirdParty/ghostty/HACKING.md.
        run: brew install xcodegen zig@0.15 create-dmg

      - name: Test build-ghostty.sh harness
        run: bash scripts/tests/build-ghostty/run.sh

      - name: Compute Ghostty cache key inputs
        run: |
          git -C ThirdParty/ghostty rev-parse HEAD > .ghostty-pin
          shasum scripts/build-ghostty.sh >> .ghostty-pin

      - name: Cache Ghostty build outputs
        uses: actions/cache@v5
        with:
          path: |
            .build/ghostty
          key: ghostty-${{ runner.os }}-${{ hashFiles('.ghostty-pin') }}

      - name: Build Ghostty xcframework
        # Must run before xcodebuild — Xcode validates xcframework refs at
        # build description time, before preBuildScripts run.
        run: ./scripts/build-ghostty.sh

      - name: Generate project
        run: xcodegen

      - name: Build release app
        run: |
          xcodebuild -project Alas.xcodeproj -scheme Alas \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS,arch=arm64' \
            -quiet build

      - name: Compute version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Sign + notarize + staple .app
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD:   ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY:       ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID:        ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_PASSWORD:    ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          MACOS_NOTARY_TEAM_ID:         ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./scripts/sign-and-notarize.sh build/Build/Products/Release/Alas.app

      - name: Package .app (zip + DMG)
        run: ./scripts/package-app.sh build/Build/Products/Release/Alas.app "Alas-${VERSION}-arm64"

      - name: Notarize + staple DMG
        env:
          MACOS_NOTARY_APPLE_ID:     ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          MACOS_NOTARY_TEAM_ID:      ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./scripts/notarize-and-staple-dmg.sh "build/Build/Products/Release/Alas-${VERSION}-arm64.dmg"

      - name: Cleanup signing keychain
        if: always()
        run: ./scripts/cleanup-signing-keychain.sh

      - name: Extract release notes
        run: |
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { body = 1; next }
            body && index($0, "## [") == 1 { exit }
            body { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md" || {
            echo "::error::No CHANGELOG.md section found for v$VERSION"
            exit 1
          }

      - name: Upload macOS artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            build/Build/Products/Release/Alas-*-arm64.app.zip
            build/Build/Products/Release/Alas-*-arm64.dmg

  update-homebrew:
    name: Update Homebrew Cask
    runs-on: ubuntu-latest
    needs: macos-app
    # Skip prereleases — those should ship a DMG for manual testing but
    # must not bump the cask that brew users follow. Tag-push releases are
    # stable by construction.
    if: github.event_name == 'push' || github.event.release.prerelease == false
    steps:
      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download DMG and compute checksum
        run: |
          curl -fsSL "https://github.com/mrmans0n/alas/releases/download/v${VERSION}/Alas-${VERSION}-arm64.dmg" -o alas.dmg
          echo "SHA_ARM=$(shasum -a 256 alas.dmg | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Checkout homebrew-tap
        run: |
          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/mrmans0n/homebrew-tap.git" homebrew-tap

      - name: Download update script
        # Pull the helper from this repo at the exact released tag so the
        # cask body is reproducible from the release ref alone.
        run: |
          curl -fsSL "https://raw.githubusercontent.com/mrmans0n/alas/${{ github.ref_name }}/.github/workflows/update-cask.py" -o update-cask.py

      - name: Update cask
        working-directory: homebrew-tap
        run: python3 ../update-cask.py

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- Casks/alas.rb)" ]; then
            echo "Cask already up to date"
            exit 0
          fi
          git add Casks/alas.rb
          git commit -m "Update alas cask to ${VERSION}"
          git push
