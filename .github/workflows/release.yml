name: Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  macos-app:
    # Same toolchain story as build.yml: macos-26 ships Xcode 26 (Ghostty's
    # main HEAD requirement). Submodule + zig@0.15 are required for the
    # Ghostty xcframework build.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install xcodegen + zig@0.15
        # Homebrew's zig@0.15 ships the patch for Zig 0.15.2 + Xcode 26.4
        # linker bug. See ThirdParty/ghostty/HACKING.md.
        run: brew install xcodegen zig@0.15

      - name: Compute Ghostty cache key inputs
        run: |
          git -C ThirdParty/ghostty rev-parse HEAD > .ghostty-pin
          shasum scripts/build-ghostty.sh >> .ghostty-pin

      - name: Cache Ghostty build outputs
        uses: actions/cache@v5
        with:
          path: |
            .build/ghostty
          key: ghostty-${{ runner.os }}-${{ hashFiles('.ghostty-pin') }}

      - name: Build Ghostty xcframework
        # Must run before xcodebuild — Xcode validates xcframework refs at
        # build description time, before preBuildScripts run.
        run: ./scripts/build-ghostty.sh

      - name: Generate project
        run: xcodegen

      - name: Build release app
        run: |
          xcodebuild -project Alas.xcodeproj -scheme Alas \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -quiet build

      - name: Zip the .app
        run: |
          cd build/Build/Products/Release
          zip -r Alas.app.zip Alas.app

      - name: Upload macOS artifact to release
        uses: softprops/action-gh-release@v3
        with:
          files: build/Build/Products/Release/Alas.app.zip
