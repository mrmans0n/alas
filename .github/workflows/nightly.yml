name: Nightly Build

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (default: main)"
        required: false
        default: main

permissions:
  contents: write

# Manual + scheduled runs queue rather than race on the rolling release.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  warm-release-dependencies:
    name: Warm ${{ matrix.arch }} Release Dependencies
    # `inputs.ref` selects the checkout; `github.ref` keeps manual cache
    # producers in the default-branch cache scope.
    if: github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && (inputs.ref == '' || inputs.ref == 'main'))
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}
          submodules: recursive
          persist-credentials: false

      - name: Install zig@0.15
        run: brew install zig@0.15

      - name: Test build-ghostty.sh harness
        run: bash scripts/tests/build-ghostty/run.sh

      - name: Compute Ghostty cache key inputs
        run: |
          ALAS_GHOSTTY_TARGET_ARCH="${{ matrix.arch }}" ./scripts/build-ghostty.sh --print-fingerprint > .ghostty-pin
          cat .ghostty-pin

      - name: Restore Ghostty cache
        id: ghostty-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/Alas/GhosttyKit/${{ matrix.arch }}
          key: ghostty-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('.ghostty-pin') }}
          restore-keys: |
            ghostty-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build Ghostty xcframework (${{ matrix.arch }})
        env:
          ALAS_GHOSTTY_TARGET_ARCH: ${{ matrix.arch }}
          ALAS_GHOSTTY_CACHE_KEEP: 1
        run: ./scripts/build-ghostty.sh

      - name: Save Ghostty cache
        if: success() && steps.ghostty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/Alas/GhosttyKit/${{ matrix.arch }}
          key: ${{ steps.ghostty-cache.outputs.cache-primary-key }}

      - name: Compute prebuilt tools cache key inputs
        run: |
          git -C ThirdParty/zmx rev-parse HEAD > .tools-pin
          {
            git -C ThirdParty/fff rev-parse HEAD
            git rev-parse HEAD:AlasHelper
            git rev-parse HEAD:AlasCLI
            git rev-parse HEAD:ThirdParty/treesitter-pack
            shasum scripts/build-zmx.sh scripts/build-fff.sh scripts/build-alas-helper.sh scripts/build-alas-cli.sh scripts/build-treesitter-pack.sh
            shasum -a 256 "$(brew --prefix zig@0.15)/bin/zig"
          } >> .tools-pin
          cat .tools-pin

      - name: Restore prebuilt tools cache
        id: tools-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/Alas/zmx
            .build/zmx/linux-*/install
            .build/zmx/linux-*/fingerprint
            .build/fff/*/install
            .build/fff/*/fingerprint
            .build/fff/include
            .build/treesitter-pack/*/install
            .build/treesitter-pack/*/fingerprint
            .build/treesitter-pack/include
            .build/alas-helper/*/release/alas-helper
            .build/alas-helper/fingerprint
            .build/alas-cli/*/release/alas
            .build/alas-cli/fingerprint
          key: tools-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('.tools-pin') }}
          restore-keys: |
            tools-${{ runner.os }}-${{ matrix.arch }}-
            tools-${{ runner.os }}-arm64-

      - name: Prebuild zmx + fff + tree-sitter pack + Alas Helper + Alas CLI (${{ matrix.arch }})
        env:
          ALAS_ZMX_TARGET_ARCH: ${{ matrix.arch }}
          ALAS_FFF_TARGET_ARCH: ${{ matrix.arch }}
          ALAS_TS_PACK_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          ./scripts/build-zmx.sh
          ./scripts/build-fff.sh
          ./scripts/build-treesitter-pack.sh
          ./scripts/build-alas-helper.sh
          ./scripts/build-alas-cli.sh

      - name: Save prebuilt tools cache
        if: success() && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Caches/Alas/zmx
            .build/zmx/linux-*/install
            .build/zmx/linux-*/fingerprint
            .build/fff/*/install
            .build/fff/*/fingerprint
            .build/fff/include
            .build/treesitter-pack/*/install
            .build/treesitter-pack/*/fingerprint
            .build/treesitter-pack/include
            .build/alas-helper/*/release/alas-helper
            .build/alas-helper/fingerprint
            .build/alas-cli/*/release/alas
            .build/alas-cli/fingerprint
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

  nightly:
    runs-on: macos-26
    # Two notarytool --wait --timeout 30m calls in this job (one for the
    # .app, one for the .dmg) can each consume up to 30 min if Apple's
    # notary queue is slow, so worst-case notary time alone is 60 min.
    # 90 min leaves ~30 min headroom for build/package/upload even when
    # both notary submissions hit their per-call timeout.
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}
          submodules: recursive
          fetch-depth: 0
          # Don't write the GitHub token into .git/config. Build phases run
          # code from `inputs.ref` — for non-main refs that may be untrusted
          # — and must not have ambient access to a `contents: write` token.
          # The only step that needs to push (the tag-move below) injects
          # the token via env, scoped to that step only.
          persist-credentials: false

      - name: Fetch tags
        run: git fetch origin --tags --force

      - name: Decide whether to skip
        id: skip-check
        # Only the scheduled cron run can skip. Manual dispatches always build.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
             && git rev-parse refs/tags/nightly >/dev/null 2>&1 \
             && [ "$(git rev-parse HEAD)" = "$(git rev-parse refs/tags/nightly)" ]; then
            echo "Nothing changed since last nightly. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture previous nightly SHA
        if: steps.skip-check.outputs.skip != 'true'
        id: prev
        run: |
          if git rev-parse refs/tags/nightly >/dev/null 2>&1; then
            echo "sha=$(git rev-parse refs/tags/nightly)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Print toolchain versions
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install xcodegen + zig@0.15 + create-dmg
        if: steps.skip-check.outputs.skip != 'true'
        run: brew install xcodegen zig@0.15 create-dmg

      - name: Test build-ghostty.sh harness
        if: steps.skip-check.outputs.skip != 'true'
        run: bash scripts/tests/build-ghostty/run.sh

      - name: Compute Ghostty cache key inputs
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          ALAS_GHOSTTY_TARGET_ARCH=arm64 ./scripts/build-ghostty.sh --print-fingerprint > .ghostty-pin
          cat .ghostty-pin

      - name: Restore Ghostty cache
        # Restore the shared arm64 cache. `build-ghostty.sh` validates the
        # restored entry and populates `.build/ghostty`. Split restore + save —
        # and gate save on main-built refs only — so a
        # non-main dispatch building an arbitrary tree can never write into the
        # repo-wide cache scope. Without this gate, a feature ref leaving
        # .ghostty-pin unchanged could seed the main-scope key with a poisoned
        # .build/ghostty, which later main builds would restore and ship.
        if: steps.skip-check.outputs.skip != 'true'
        id: ghostty-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/Alas/GhosttyKit/arm64
          key: ghostty-${{ runner.os }}-arm64-${{ hashFiles('.ghostty-pin') }}
          restore-keys: |
            ghostty-${{ runner.os }}-arm64-

      - name: Build Ghostty xcframework
        if: steps.skip-check.outputs.skip != 'true'
        env:
          ALAS_GHOSTTY_TARGET_ARCH: arm64
          ALAS_GHOSTTY_CACHE_KEEP: 1
        run: ./scripts/build-ghostty.sh

      - name: Save Ghostty cache (main builds only)
        if: success()
          && steps.skip-check.outputs.skip != 'true'
          && steps.ghostty-cache.outputs.cache-hit != 'true'
          && (inputs.ref == '' || inputs.ref == 'main')
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/Alas/GhosttyKit/arm64
          key: ${{ steps.ghostty-cache.outputs.cache-primary-key }}

      - name: Compute prebuilt tools cache key inputs
        if: steps.skip-check.outputs.skip != 'true'
        # Same pin-file pattern as .ghostty-pin: the fingerprint inputs the
        # build scripts consult but hashFiles can't reach (submodule HEADs,
        # the zig binary) get dumped into a small file we can hash.
        # The zig *binary content* hash (not `zig version`) matters because
        # build-zmx.sh hashes the binary into its fingerprint — a Homebrew
        # bottle rebuild with an unchanged version string must still change
        # the key. Helper's rust toolchain is pinned inside its script, so
        # the script hash covers it.
        run: |
          git -C ThirdParty/zmx rev-parse HEAD > .tools-pin
          {
            git -C ThirdParty/fff rev-parse HEAD
            git rev-parse HEAD:AlasHelper
            git rev-parse HEAD:AlasCLI
            git rev-parse HEAD:ThirdParty/treesitter-pack
            shasum scripts/build-zmx.sh scripts/build-fff.sh scripts/build-alas-helper.sh scripts/build-alas-cli.sh scripts/build-treesitter-pack.sh
            shasum -a 256 "$(brew --prefix zig@0.15)/bin/zig"
          } >> .tools-pin
          cat .tools-pin

      - name: Restore prebuilt tools cache
        if: steps.skip-check.outputs.skip != 'true'
        # zmx / fff / Alas Helper / Alas CLI artifacts combined in one entry — each is
        # a few MB, and only install outputs + fingerprint markers are
        # cached (no zig/cargo intermediates). The key is an optimization
        # hint only: each script re-validates restored artifacts against its
        # own fingerprint (submodule SHA + dirt + arch + toolchain + script
        # hash), so a stale restore-keys fallback can never ship a wrong
        # binary — the changed component rebuilds while the rest fast-path.
        # zmx's macOS slice fast-paths off the *host* cache
        # (~/Library/Caches/Alas/zmx), not the worktree output, hence that
        # path; the Linux slices and fff/helper check worktree markers.
        id: tools-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/Alas/zmx
            .build/zmx/linux-*/install
            .build/zmx/linux-*/fingerprint
            .build/fff/*/install
            .build/fff/*/fingerprint
            .build/fff/include
            .build/treesitter-pack/*/install
            .build/treesitter-pack/*/fingerprint
            .build/treesitter-pack/include
            .build/alas-helper/*/release/alas-helper
            .build/alas-helper/fingerprint
            .build/alas-cli/*/release/alas
            .build/alas-cli/fingerprint
          key: tools-${{ runner.os }}-arm64-${{ hashFiles('.tools-pin') }}
          restore-keys: |
            tools-${{ runner.os }}-arm64-

      - name: Prebuild zmx + fff + tree-sitter pack + Alas Helper + Alas CLI
        if: steps.skip-check.outputs.skip != 'true'
        # These normally run as pre-build script phases *inside* xcodebuild,
        # where a cold run buries ~11 min of zig/cargo work inside the build
        # step and a later failure throws it away. Run them as their own
        # step so the artifacts can be cached the moment they exist; the
        # in-xcodebuild phases then fast-path in seconds.
        run: |
          ./scripts/build-zmx.sh
          ./scripts/build-fff.sh
          ./scripts/build-treesitter-pack.sh
          ./scripts/build-alas-helper.sh
          ./scripts/build-alas-cli.sh

      - name: Save prebuilt tools cache (main builds only)
        # Gate on main-built refs like the Ghostty save above — a non-main
        # dispatch building an arbitrary tree must never seed the repo-wide
        # cache scope with a poisoned artifact.
        if: success()
          && steps.skip-check.outputs.skip != 'true'
          && steps.tools-cache.outputs.cache-hit != 'true'
          && (inputs.ref == '' || inputs.ref == 'main')
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Caches/Alas/zmx
            .build/zmx/linux-*/install
            .build/zmx/linux-*/fingerprint
            .build/fff/*/install
            .build/fff/*/fingerprint
            .build/fff/include
            .build/treesitter-pack/*/install
            .build/treesitter-pack/*/fingerprint
            .build/treesitter-pack/include
            .build/alas-helper/*/release/alas-helper
            .build/alas-helper/fingerprint
            .build/alas-cli/*/release/alas
            .build/alas-cli/fingerprint
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

      - name: Generate project
        if: steps.skip-check.outputs.skip != 'true'
        run: xcodegen

      - name: Compute Xcode package cache key inputs
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          xcodebuild -version > .xcode-cache-toolchain
          swift --version >> .xcode-cache-toolchain
          cat .xcode-cache-toolchain

      - name: Restore SwiftPM package cache
        if: steps.skip-check.outputs.skip != 'true'
        id: swiftpm-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/xcode/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.xcode-cache-toolchain', 'project.yml', 'Alas.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve SwiftPM packages
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Alas.xcodeproj \
            -scheme Alas \
            -clonedSourcePackagesDirPath .build/xcode/SourcePackages

      - name: Save SwiftPM package cache
        if: success()
          && steps.skip-check.outputs.skip != 'true'
          && steps.swiftpm-cache.outputs.cache-hit != 'true'
          && (inputs.ref == '' || inputs.ref == 'main')
        uses: actions/cache/save@v6
        with:
          path: .build/xcode/SourcePackages
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

      - name: Stamp nightly build identity into source Info.plist
        # Overwrite the stable-default Info.plist keys committed in the repo
        # with the real track / SHA / build-date. Must run BEFORE the build
        # so xcodebuild copies the stamped plist into the bundle and signing
        # seals it. Stamping the built bundle's plist after signing would
        # invalidate the signature on non-main dispatches (which build but
        # skip the later Developer-ID signing step).
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          plist="Alas/Resources/Info.plist"
          sha="$(git rev-parse HEAD)"
          iso_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          plutil -replace AlasReleaseTrack -string "nightly" "$plist"
          plutil -replace AlasGitSHA -string "$sha" "$plist"
          plutil -replace AlasBuildDate -string "$iso_date" "$plist"
          plutil -lint "$plist"

      - name: Build release app
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          xcodebuild -project Alas.xcodeproj -scheme Alas \
            -configuration Release \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath .build/xcode/SourcePackages \
            -destination 'platform=macOS,arch=arm64' \
            -quiet build

      # Gate signing on main-built refs only — non-main workflow_dispatch
      # checks out (and runs scripts from) the dispatched ref, so handing
      # the Developer ID cert + notary credentials to that ref's scripts
      # would let a modified sign-and-notarize.sh on a feature branch
      # exfiltrate the cert. Same threat model that already restricts
      # `Save Ghostty cache`, `Upload to rolling nightly release`, and
      # `Move nightly tag` below. Non-main dispatches still produce a
      # build via the artifacts-upload path — just ad-hoc-signed, as it
      # was before this workflow learned to sign.
      - name: Sign + notarize + staple .app
        if: steps.skip-check.outputs.skip != 'true' && (inputs.ref == '' || inputs.ref == 'main')
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD:   ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY:       ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID:        ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_PASSWORD:    ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          MACOS_NOTARY_TEAM_ID:         ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./scripts/sign-and-notarize.sh build/Build/Products/Release/Alas.app

      - name: Package .app (zip + DMG)
        if: steps.skip-check.outputs.skip != 'true'
        run: ./scripts/package-app.sh build/Build/Products/Release/Alas.app Alas-nightly

      - name: Notarize + staple DMG
        if: steps.skip-check.outputs.skip != 'true' && (inputs.ref == '' || inputs.ref == 'main')
        env:
          MACOS_NOTARY_APPLE_ID:     ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          MACOS_NOTARY_TEAM_ID:      ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./scripts/notarize-and-staple-dmg.sh build/Build/Products/Release/Alas-nightly.dmg

      - name: Cleanup signing keychain
        if: always() && steps.skip-check.outputs.skip != 'true' && (inputs.ref == '' || inputs.ref == 'main')
        run: ./scripts/cleanup-signing-keychain.sh

      - name: Compose release body
        if: steps.skip-check.outputs.skip != 'true'
        id: body
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          full_sha="$(git rev-parse HEAD)"
          ts="$(date -u +'%Y-%m-%d %H:%M UTC')"
          {
            echo "body<<__ALAS_NIGHTLY_BODY__"
            echo "**Build:** \`$short_sha\` ($full_sha)"
            echo "**Built:** $ts"
            echo "**Ref:** \`${{ inputs.ref || 'main' }}\`"
            echo ""
            echo "## Changes since previous nightly"
            echo ""
            if [ -n "${{ steps.prev.outputs.sha }}" ]; then
              git log --oneline "${{ steps.prev.outputs.sha }}..HEAD" || echo "_(no commit log available)_"
            else
              echo "_Initial nightly build._"
            fi
            echo "__ALAS_NIGHTLY_BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to rolling nightly release (main builds only)
        # Only main builds publish to the public rolling release. Non-main
        # dispatches go to workflow artifacts below so the public `nightly`
        # URL never serves feature-branch builds.
        if: steps.skip-check.outputs.skip != 'true' && (inputs.ref == '' || inputs.ref == 'main')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          body: ${{ steps.body.outputs.body }}
          files: |
            build/Build/Products/Release/Alas-nightly.app.zip
            build/Build/Products/Release/Alas-nightly.dmg

      - name: Upload artifacts (non-main dispatches)
        # Non-main dispatches produce a workflow artifact instead of a public
        # release upload. Useful for testing the build path on a feature ref
        # without polluting the rolling `nightly` release.
        if: steps.skip-check.outputs.skip != 'true' && inputs.ref != '' && inputs.ref != 'main'
        uses: actions/upload-artifact@v7
        with:
          name: alas-nightly-build
          path: |
            build/Build/Products/Release/Alas-nightly.app.zip
            build/Build/Products/Release/Alas-nightly.dmg
          retention-days: 14

      - name: Move nightly tag (main builds only)
        # Gate on the built ref (`inputs.ref`), not `github.ref` — the latter
        # is the dispatch ref and can be `main` while we built a feature
        # branch. Tag the actually-checked-out HEAD so the tag matches the
        # uploaded artifacts even when bash expansion of `$GITHUB_SHA` would
        # name the dispatch SHA instead. Token is injected via env (scoped to
        # this step) since checkout was run with persist-credentials: false.
        if: steps.skip-check.outputs.skip != 'true' && (inputs.ref == '' || inputs.ref == 'main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(git rev-parse HEAD)"
          git tag -f nightly "$sha"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64)"
          git -c http.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin --force "refs/tags/nightly"
