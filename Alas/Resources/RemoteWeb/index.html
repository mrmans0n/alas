<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#151c20" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Alas Remote" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <title>Alas Remote</title>
  <link rel="stylesheet" href="/style.css?v=42" />
</head>
<body>
  <header id="bar">
    <button id="back" class="hidden">‹ Sessions</button>
    <span id="detail-title" class="hidden"></span>
    <button id="detail-rename" class="rename-btn hidden" aria-label="Rename session">✎</button>
    <div id="detail-tabs" class="tabs hidden" role="tablist">
      <button id="tab-chat" class="tab is-active" role="tab" type="button">Chat</button>
      <button id="tab-changes" class="tab" role="tab" type="button">Changes</button>
      <button id="tab-files" class="tab" role="tab" type="button">Files</button>
    </div>
    <span id="nav-title">Alas Remote</span>
    <button id="new-session" aria-label="New session">+ New</button>
    <span id="status" class="chip" data-state="connecting">connecting…</span>
  </header>
  <main>
    <section id="sessions" class="view"><h1>Sessions</h1><div id="session-list"></div></section>
    <section id="transcript" class="view hidden">
      <div id="messages"></div>
      <div id="queued" class="hidden"></div>
      <div id="drivebar">
        <button id="takeover" class="hidden">Take over</button>
        <div id="composer" class="hidden">
          <div id="chips" class="hidden"></div>
          <div id="composer-row">
            <button id="attach" class="hidden" aria-label="Attach image">
              <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.6 1.6 0 0 1-2.3-2.3l7.8-7.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <textarea id="prompt" rows="1" placeholder="Message…"></textarea>
            <button id="config" aria-label="Configure session">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <button id="send" aria-label="Send">
              <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span id="send-badge" class="hidden"></span>
            </button>
            <div id="queue-capsule" class="hidden">
              <button id="queue-primary" aria-label="Queue message">
                <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Queue</span>
                <span id="queue-badge" class="hidden"></span>
              </button>
              <button id="queue-menu" aria-label="More send actions">
                <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            <button id="stop" class="hidden" aria-label="Stop">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.6" fill="currentColor"/></svg>
            </button>
          </div>
          <input id="file" type="file" accept="image/*" multiple hidden />
        </div>
      </div>
    </section>
    <section id="changes" class="view hidden">
      <div id="changes-header">
        <span id="changes-summary"></span>
        <button id="changes-refresh" type="button" aria-label="Refresh changes">↻</button>
      </div>
      <p id="changes-error" class="sheet-error hidden" role="alert"></p>
      <div id="changes-list"></div>
      <div id="diff-view" class="hidden">
        <p id="diff-path" class="detail-path"></p>
        <div id="diff-rows"></div>
      </div>
    </section>
    <section id="files" class="view hidden">
      <p id="file-error" class="sheet-error hidden" role="alert"></p>
      <div id="file-list"></div>
      <div id="file-view" class="hidden">
        <p id="file-view-path" class="detail-path"></p>
        <div id="file-view-body"></div>
      </div>
    </section>
  </main>
  <div id="permission" class="sheet hidden">
    <div class="sheet-card">
      <p id="perm-tool"></p>
      <div id="perm-options"></div>
      <button id="perm-close" class="sheet-close">Close</button>
    </div>
  </div>
  <div id="question" class="sheet hidden">
    <div class="sheet-card">
      <p id="question-title" class="sheet-title hidden"></p>
      <div id="question-body"></div>
      <button id="question-submit" class="btn-submit" disabled>Submit</button>
      <button id="question-close" class="sheet-close">Close</button>
    </div>
  </div>
  <div id="elicitation" class="sheet hidden">
    <div class="sheet-card elicitation-card">
      <p id="elicitation-title" class="sheet-title"></p>
      <p id="elicitation-message" class="elicitation-message"></p>
      <div id="elicitation-body"></div>
      <p id="elicitation-error" class="sheet-error hidden"></p>
      <button id="elicitation-submit" class="btn-submit">Submit</button>
      <button id="elicitation-decline" class="sheet-close">Decline</button>
      <button id="elicitation-cancel" class="sheet-close">Cancel</button>
    </div>
  </div>
  <div id="cfg" class="sheet hidden">
    <div class="sheet-card">
      <div id="cfg-scroll">
        <div id="cfg-model-section">
          <p class="sheet-title">Model</p>
          <div id="cfg-models"></div>
        </div>
        <div id="cfg-mode-section">
          <p class="sheet-title">Mode</p>
          <div id="cfg-modes"></div>
        </div>
        <label id="cfg-autorun-row">
          <span>Auto-run tools</span>
          <input id="cfg-autorun" type="checkbox" />
        </label>
      </div>
      <button id="cfg-close" class="sheet-close">Close</button>
    </div>
  </div>
  <div id="steer-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="steer-title">
    <div class="sheet-card">
      <p id="steer-title" class="sheet-title">Send actions</p>
      <button id="steer-now" class="option-btn">Steer running turn</button>
      <button id="steer-stop" class="option-btn is-destructive">Stop running turn</button>
      <button id="steer-close" class="sheet-close">Close</button>
    </div>
  </div>
  <div id="new-session-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="new-session-title">
    <div class="sheet-card create-sheet">
      <p id="new-session-title" class="sheet-title">New session</p>
      <div id="create-error" class="sheet-error hidden" role="alert" aria-live="assertive"></div>
      <div id="worktree-step">
        <div id="existing-worktree-picker">
          <button id="create-new-worktree" class="option-btn" type="button">Create new worktree</button>
          <label class="sheet-label" for="worktree-search">Existing worktree</label>
          <input id="worktree-search" class="sheet-input" type="search" autocomplete="off" placeholder="Search worktrees" aria-label="Search worktrees" />
          <div id="worktree-list" class="create-list"></div>
        </div>
        <div id="new-worktree-form" class="hidden">
          <label class="sheet-label" for="project-select">Repository</label>
          <select id="project-select" class="sheet-input" aria-describedby="project-guidance"></select>
          <p id="project-guidance" class="form-guidance"></p>
          <label class="sheet-label" for="base-select">Base branch</label>
          <select id="base-select" class="sheet-input" aria-describedby="branch-status"></select>
          <p id="branch-status" class="form-guidance" role="status"></p>
          <button id="retry-branches" class="sheet-close hidden" type="button">Retry branches</button>
          <label class="sheet-label" for="new-branch">New branch</label>
          <input id="new-branch" class="sheet-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="feature/new-worktree" aria-describedby="new-branch-guidance" />
          <p id="new-branch-guidance" class="form-guidance">Use a valid Git branch name.</p>
        </div>
      </div>
      <div id="agent-step" class="hidden">
        <div id="new-worktree-review" class="create-review hidden" aria-live="polite"></div>
        <p id="agent-picker-label" class="sheet-label">Agent</p>
        <div id="agent-list" class="create-list" role="group" aria-labelledby="agent-picker-label"></div>
      </div>
      <div class="create-actions">
        <button id="create-back" class="sheet-close hidden">Back</button>
        <button id="create-next" class="btn-submit" disabled>Next</button>
        <button id="create-cancel" class="sheet-close">Cancel</button>
      </div>
    </div>
  </div>
  <div id="rename-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="rename-title">
    <div class="sheet-card">
      <p id="rename-title" class="sheet-title">Rename session</p>
      <input id="rename-input" class="sheet-input" type="text" autocomplete="off" maxlength="120" aria-label="Session title" />
      <button id="rename-submit" class="btn-submit">Rename</button>
      <button id="rename-cancel" class="sheet-close">Cancel</button>
    </div>
  </div>
  <div id="gate" class="hidden">
    <div class="gate-card">
      <div class="gate-icon" id="gate-icon">⚠</div>
      <h2 id="gate-title">Pair this device</h2>
      <p id="gate-msg"></p>
      <button id="gate-retry" class="hidden">Try again</button>
    </div>
  </div>
  <script src="/marked.min.js?v=28"></script>
  <script src="/purify.min.js?v=28"></script>
  <script src="/session-ordering.js?v=1"></script>
  <script src="/worktree-creation.js?v=1"></script>
  <script src="/changes-view.js?v=1"></script>
  <script src="/file-browser.js?v=1"></script>
  <script src="/app.js?v=65"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
