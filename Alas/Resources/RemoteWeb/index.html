<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2127" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Alas" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <title>Alas</title>
  <link rel="stylesheet" href="/style.css?v=53" />
</head>
<body>
  <header id="bar">
    <button id="back" class="hidden" type="button" aria-label="Back">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
    </button>
    <div id="detail-title-block" class="hidden">
      <span id="detail-title"></span>
      <span id="detail-subtitle"></span>
    </div>
    <button id="detail-rename" class="iconbtn hidden" type="button" aria-label="Rename session">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.2 2.6l2.2 2.2-8 8-2.9.7.7-2.9z"/></svg>
    </button>
    <span id="nav-title">Alas</span>
    <span id="status" class="chip" data-state="connecting">connecting…</span>
  </header>
  <div id="detail-tabs" class="tabs hidden" role="tablist">
    <button id="tab-chat" class="tab is-active" role="tab" type="button" aria-selected="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5a5 5 0 0 1 5-5h1a5 5 0 0 1 0 10H5l-2.5 2z"/></svg>
      <span>Chat</span>
    </button>
    <button id="tab-changes" class="tab" role="tab" type="button" aria-selected="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13V5.5M4 5.5L2 7.5M4 5.5L6 7.5M12 3v7.5M12 10.5l2-2M12 10.5l-2-2"/></svg>
      <span>Changes</span>
      <span id="tab-changes-count" class="tab-count hidden"></span>
    </button>
    <button id="tab-files" class="tab" role="tab" type="button" aria-selected="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5a1 1 0 011-1h3.5l1.5 1.5h5a1 1 0 011 1V12a1 1 0 01-1 1H3a1 1 0 01-1-1z"/></svg>
      <span>Files</span>
    </button>
  </div>
  <main>
    <section id="sessions" class="view">
      <div id="repo-search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4"/><path d="M10 10l3 3"/></svg>
        <input id="repo-search-input" type="search" autocomplete="off" placeholder="Search repos and worktrees" aria-label="Search repos and worktrees" />
      </div>
      <div id="repo-filters" role="group" aria-label="Filter repos">
        <button type="button" class="filter-chip is-active" data-filter="all">All<span class="filter-chip-n"></span></button>
        <button type="button" class="filter-chip" data-filter="running">Running<span class="filter-chip-n"></span></button>
        <button type="button" class="filter-chip" data-filter="dirty">Dirty<span class="filter-chip-n"></span></button>
      </div>
      <div id="session-list"></div>
    </section>
    <section id="transcript" class="view hidden">
      <div id="messages"></div>
      <div id="queued" class="hidden"></div>
      <div id="drivebar">
        <button id="takeover" class="hidden" type="button">Take over</button>
        <div id="composer" class="hidden">
          <div id="chips" class="hidden"></div>
          <div id="composer-row">
            <div id="field">
              <button id="attach" class="hidden" type="button" aria-label="Attach image">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 4L5 8.5a2.5 2.5 0 003.5 3.5l4.5-4.5a4 4 0 00-5.7-5.7L3 6.6"/></svg>
              </button>
              <textarea id="prompt" rows="1" placeholder="Message…"></textarea>
              <button id="config" type="button" aria-label="Configure session">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M14.5 8h-2M3.5 8h-2M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4M12.6 12.6l-1.4-1.4M4.8 4.8L3.4 3.4"/></svg>
              </button>
            </div>
            <button id="send" class="action-btn" type="button" aria-label="Send">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M4 7l4-4 4 4"/></svg>
              <span id="send-badge" class="hidden"></span>
            </button>
            <div id="queue-capsule" class="hidden">
              <button id="queue-primary" type="button" aria-label="Queue message">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M4 7l4-4 4 4"/></svg>
                <span>Queue</span>
                <span id="queue-badge" class="hidden"></span>
              </button>
              <button id="queue-menu" type="button" aria-label="More send actions">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6L8 10.5 12.5 6"/></svg>
              </button>
            </div>
            <button id="stop" class="action-btn hidden" type="button" aria-label="Stop">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3" fill="currentColor"/></svg>
            </button>
          </div>
          <input id="file" type="file" accept="image/*" multiple hidden />
        </div>
      </div>
    </section>
    <section id="changes" class="view hidden">
      <div id="changes-header">
        <span id="changes-summary"></span>
        <button id="changes-refresh" type="button" aria-label="Refresh changes">↻</button>
      </div>
      <p id="changes-error" class="sheet-error hidden" role="alert"></p>
      <div id="changes-list"></div>
      <div id="diff-view" class="hidden">
        <p id="diff-path" class="detail-path"></p>
        <div id="diff-rows"></div>
      </div>
    </section>
    <section id="files" class="view hidden">
      <p id="file-error" class="sheet-error hidden" role="alert"></p>
      <div id="file-list"></div>
      <div id="file-view" class="hidden">
        <p id="file-view-path" class="detail-path"></p>
        <div id="file-view-body"></div>
      </div>
    </section>
    <section id="settings" class="view hidden">
      <h1>Settings</h1>
      <div id="hub-section" class="hidden">
        <p class="sheet-label">Servers</p>
        <div id="server-list"></div>
        <button id="add-server" class="option-btn" type="button">Add server…</button>
      </div>
      <p id="settings-placeholder" class="placeholder-card">Settings are coming soon.</p>
    </section>
  </main>
  <nav id="bottom-tabbar">
    <button type="button" id="tab-repos" class="bt-tab is-active" aria-label="Repos">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.6"/><path d="M5 2.5v11M5 6h9M5 10h9"/></svg>
      <span>Repos</span>
    </button>
    <div class="bt-fabwrap"><button type="button" id="fab-new-session" aria-label="New session">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
    </button></div>
    <button type="button" id="tab-settings" class="bt-tab" aria-label="Settings" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M14.5 8h-2M3.5 8h-2M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4M12.6 12.6l-1.4-1.4M4.8 4.8L3.4 3.4"/></svg>
      <span>Settings</span>
      <span id="tab-settings-badge" class="tab-count hidden"></span>
    </button>
  </nav>
  <div id="permission" class="sheet hidden">
    <div class="sheet-card">
      <p id="perm-heading" class="sheet-title" hidden></p>
      <p id="perm-tool"></p>
      <p id="perm-server" class="perm-meta" hidden></p>
      <p id="perm-reason" class="perm-meta" hidden></p>
      <div id="perm-options"></div>
      <button id="perm-close" class="sheet-close">Close</button>
    </div>
  </div>
  <div id="question" class="sheet hidden">
    <div class="sheet-card">
      <p id="question-title" class="sheet-title hidden"></p>
      <div id="question-body"></div>
      <button id="question-submit" class="btn-submit" disabled>Submit</button>
      <button id="question-close" class="sheet-close">Close</button>
    </div>
  </div>
  <div id="plan" class="sheet hidden">
    <div class="sheet-card plan-card">
      <p id="plan-title" class="sheet-title"></p>
      <p id="plan-overview" class="plan-overview"></p>
      <div id="plan-body" class="plan-body"></div>
      <div id="plan-todos" class="plan-todos"></div>
      <input id="plan-reason" class="sheet-input" type="text" autocomplete="off" placeholder="Reason for rejection" aria-label="Reason for rejection" />
      <div class="plan-actions">
        <button id="plan-reject" class="sheet-close" type="button" disabled>Reject</button>
        <button id="plan-accept" class="btn-submit" type="button">Accept</button>
      </div>
      <button id="plan-close" class="sheet-close" type="button">Close</button>
    </div>
  </div>
  <div id="elicitation" class="sheet hidden">
    <div class="sheet-card elicitation-card">
      <p id="elicitation-title" class="sheet-title"></p>
      <p id="elicitation-message" class="elicitation-message"></p>
      <div id="elicitation-body"></div>
      <p id="elicitation-error" class="sheet-error hidden"></p>
      <button id="elicitation-submit" class="btn-submit">Submit</button>
      <button id="elicitation-decline" class="sheet-close">Decline</button>
      <button id="elicitation-cancel" class="sheet-close">Cancel</button>
    </div>
  </div>
  <div id="cfg" class="sheet hidden">
    <div class="sheet-card">
      <div id="cfg-scroll">
        <div id="cfg-model-section">
          <p class="sheet-title">Model</p>
          <div id="cfg-models"></div>
        </div>
        <div id="cfg-mode-section">
          <p class="sheet-title">Mode</p>
          <div id="cfg-modes"></div>
        </div>
        <label id="cfg-autorun-row">
          <span>Auto-run tools</span>
          <input id="cfg-autorun" type="checkbox" />
        </label>
      </div>
      <button id="cfg-close" class="sheet-close">Close</button>
    </div>
  </div>
  <div id="steer-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="steer-title">
    <div class="sheet-card">
      <p id="steer-title" class="sheet-title">Send actions</p>
      <button id="steer-now" class="option-btn">Steer running turn</button>
      <button id="steer-stop" class="option-btn is-destructive">Stop running turn</button>
      <button id="steer-close" class="sheet-close">Close</button>
    </div>
  </div>
  <div id="new-session-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="new-session-title">
    <div class="sheet-card create-sheet">
      <p id="new-session-title" class="sheet-title">New session</p>
      <div id="create-error" class="sheet-error hidden" role="alert" aria-live="assertive"></div>
      <div id="worktree-step">
        <div id="existing-worktree-picker">
          <button id="create-new-worktree" class="option-btn" type="button">Create new worktree</button>
          <label class="sheet-label" for="worktree-search">Existing worktree</label>
          <input id="worktree-search" class="sheet-input" type="search" autocomplete="off" placeholder="Search worktrees" aria-label="Search worktrees" />
          <div id="worktree-list" class="create-list"></div>
        </div>
        <div id="new-worktree-form" class="hidden">
          <label class="sheet-label" for="project-select">Repository</label>
          <select id="project-select" class="sheet-input" aria-describedby="project-guidance"></select>
          <p id="project-guidance" class="form-guidance"></p>
          <label class="sheet-label" for="base-select">Base branch</label>
          <select id="base-select" class="sheet-input" aria-describedby="branch-status"></select>
          <p id="branch-status" class="form-guidance" role="status"></p>
          <button id="retry-branches" class="sheet-close hidden" type="button">Retry branches</button>
          <label class="sheet-label" for="new-branch">New branch</label>
          <input id="new-branch" class="sheet-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="feature/new-worktree" aria-describedby="new-branch-guidance" />
          <p id="new-branch-guidance" class="form-guidance">Use a valid Git branch name.</p>
        </div>
      </div>
      <div id="agent-step" class="hidden">
        <div id="new-worktree-review" class="create-review hidden" aria-live="polite"></div>
        <p id="agent-picker-label" class="sheet-label">Agent</p>
        <div id="agent-list" class="create-list" role="group" aria-labelledby="agent-picker-label"></div>
      </div>
      <div class="create-actions">
        <button id="create-back" class="sheet-close hidden">Back</button>
        <button id="create-next" class="btn-submit" disabled>Next</button>
        <button id="create-cancel" class="sheet-close">Cancel</button>
      </div>
    </div>
  </div>
  <div id="rename-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="rename-title">
    <div class="sheet-card">
      <p id="rename-title" class="sheet-title">Rename session</p>
      <input id="rename-input" class="sheet-input" type="text" autocomplete="off" maxlength="120" aria-label="Session title" />
      <button id="rename-submit" class="btn-submit">Rename</button>
      <button id="rename-cancel" class="sheet-close">Cancel</button>
    </div>
  </div>
  <div id="add-server-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="add-server-title">
    <div class="sheet-card">
      <p id="add-server-title" class="sheet-title">Add server</p>
      <div id="add-server-error" class="sheet-error hidden" role="alert" aria-live="assertive"></div>
      <label class="sheet-label" for="add-server-link">Pairing link</label>
      <input id="add-server-link" class="sheet-input" type="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Paste the link from Alas → Settings → Remote" />
      <details id="add-server-manual">
        <summary class="sheet-label">Enter an address and code instead</summary>
        <input id="add-server-address" class="sheet-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="100.64.1.5:8765" aria-label="Server address" />
        <input id="add-server-code" class="sheet-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Pairing code" aria-label="Pairing code" />
      </details>
      <button id="add-server-submit" class="btn-submit" type="button">Pair</button>
      <button id="add-server-cancel" class="sheet-close" type="button">Cancel</button>
    </div>
  </div>
  <div id="server-actions-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="server-actions-title">
    <div class="sheet-card">
      <p id="server-actions-title" class="sheet-title">Server</p>
      <button id="server-repair" class="option-btn" type="button">Re-pair…</button>
      <button id="server-forget" class="option-btn is-destructive" type="button">Forget this server</button>
      <button id="server-actions-close" class="sheet-close" type="button">Close</button>
    </div>
  </div>
  <div id="gate" class="hidden">
    <div class="gate-card">
      <div class="gate-icon" id="gate-icon">⚠</div>
      <h2 id="gate-title">Pair this device</h2>
      <p id="gate-msg"></p>
      <button id="gate-retry" class="hidden">Try again</button>
      <button id="gate-pair" class="hidden">Paste a pairing link</button>
    </div>
  </div>
  <script src="/marked.min.js?v=28"></script>
  <script src="/purify.min.js?v=28"></script>
  <script src="/repo-filter.js?v=3"></script>
  <script src="/session-ordering.js?v=2"></script>
  <script src="/worktree-creation.js?v=1"></script>
  <script src="/changes-view.js?v=8"></script>
  <script src="/file-browser.js?v=3"></script>
  <script src="/hub-registry.js?v=1"></script>
  <script src="/hub-links.js?v=1"></script>
  <script src="/app.js?v=89"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
