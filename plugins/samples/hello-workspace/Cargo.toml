[package]
name = "hello-workspace"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: not part of any parent workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
alas-plugin = { git = "https://github.com/mrmans0n/alas-plugins", tag = "sdk-v0.1.0" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
