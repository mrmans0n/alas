[package]
name = "pixel-office"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: not part of any parent workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alas-plugin = { path = "../alas-plugin" }
serde_json = "1"

[build-dependencies]
png = "0.18"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
