[package]
name = "kanban"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: not part of any parent workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alas-plugin = { path = "../alas-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
