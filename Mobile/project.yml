name: AlasMobile
options:
  bundleIdPrefix: io.nlopez
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO

packages:
  AlasCore:
    path: ../Packages/AlasCore
  Markdown:
    url: https://github.com/apple/swift-markdown
    from: 0.9.0

targets:
  AlasMobile:
    type: application
    platform: iOS
    configFiles:
      Debug: ../Config/AlasMobile-Debug.xcconfig
      Release: ../Config/AlasMobile-Release.xcconfig
    sources:
      - path: Sources
      # Shared with the Mac: the frame visual aid fragments are wrapped in.
      - path: ../Alas/Resources/VisualAid/frame.html
        buildPhase: resources
    dependencies:
      - package: AlasCore
        product: AlasRemoteKit
      - package: Markdown
        product: Markdown
      - target: AlasNotificationService
        embed: true
    settings:
      base:
        PRODUCT_NAME: Alas
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: AlasMobile.entitlements
      properties:
        aps-environment: $(ALAS_APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - $(ALAS_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER).shared
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: $(ALAS_DISPLAY_NAME)
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Alas connects to your Macs on this network.
        NSCameraUsageDescription: Scan a pairing code from your Mac.
        UIBackgroundModes:
          - remote-notification
        AlasPushRelayURL: $(ALAS_PUSH_RELAY_URL)
        AlasPushEnvironment: $(ALAS_APS_ENVIRONMENT)
        AlasAppGroup: $(ALAS_APP_GROUP)
        AlasKeychainGroup: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER).shared

  AlasNotificationService:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: ../Config/AlasMobile-Debug.xcconfig
      Release: ../Config/AlasMobile-Release.xcconfig
    sources:
      - path: NotificationService
      - path: Sources/Hosts/HostStore.swift
      - path: Sources/Hosts/PhoneProtocol.swift
    dependencies:
      - package: AlasCore
        product: AlasRemoteKit
    settings:
      base:
        PRODUCT_NAME: AlasNotificationService
        PRODUCT_BUNDLE_IDENTIFIER: $(ALAS_APP_BUNDLE_ID).NotificationService
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    # Reads the app's shared storage, so it carries the app's group ids.
    entitlements:
      path: NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - $(ALAS_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(ALAS_APP_BUNDLE_ID).shared
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: $(ALAS_DISPLAY_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        AlasAppGroup: $(ALAS_APP_GROUP)
        AlasKeychainGroup: $(AppIdentifierPrefix)$(ALAS_APP_BUNDLE_ID).shared

schemes:
  AlasMobile:
    build:
      targets:
        AlasMobile: all
    run:
      config: Debug
      # Scenario drivers for the transcript spike; enable per scenario in the scheme editor.
      # Profile inherits these.
      commandLineArguments:
        "-spikePreloadPages 23": false
        "-spikeWindowSize 20": false
