name: AlasMobile
options:
  bundleIdPrefix: io.nlopez
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    # The app and its extension must match; scripts/ios-testflight.sh raises the build number per upload.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  AlasCore:
    path: ../Packages/AlasCore
  Markdown:
    url: https://github.com/apple/swift-markdown
    from: 0.9.0
  # Trust SwiftTermBuildInfoPlugin when opening in Xcode; command-line builds use -skipPackagePluginValidation.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    minorVersion: 1.99.3
  BeautifulMermaidSwift:
    url: https://github.com/lukilabs/beautiful-mermaid-swift
    from: 1.0.4

targets:
  AlasMobile:
    type: application
    platform: iOS
    configFiles:
      Debug: ../Config/AlasMobile-Debug.xcconfig
      Release: ../Config/AlasMobile-Release.xcconfig
    sources:
      - path: Sources
      - path: ../Alas/Sources/UI/Boids.swift
      # Shared with the Mac: the GitHub and GitLab marks reference chips draw.
      - path: ../Alas/Sources/Icons/CodeHostGlyphs.swift
      # Shared with the Mac: file-type icons, drawn from FileTypeIcons.ttf, a subset of
      # its Nerd Font (scripts/subset-file-type-icon-font.sh).
      - path: ../Alas/Sources/Right/FileTypeIcon.swift
      - path: ../Alas/Sources/Remote/Native/PeerDeviceSession.swift
      - path: ../Alas/Sources/Remote/Native/PeerDevicePlayback.swift
      - path: ../Packages/AlasCore/Sources/AlasHostCore/Remote/Forward/PeerPortForwarder.swift
      - path: ../Packages/AlasCore/Sources/AlasHostCore/Remote/Transport/TCP.swift
      - path: ../Packages/AlasCore/Sources/AlasHostCore/Remote/Transport/TCP+Network.swift
      - path: Resources/Assets.xcassets
      # Shared with the Mac: the frame visual aid fragments are wrapped in.
      - path: ../Alas/Resources/VisualAid/frame.html
        buildPhase: resources
      # Shared with the Mac: the syntax colour themes code blocks are painted with.
      - path: ../Alas/Resources/Themes/light.json
        buildPhase: resources
      - path: ../Alas/Resources/Themes/cool-slate.json
        buildPhase: resources
      - path: Resources/FileTypeIcons.ttf
        buildPhase: resources
      - path: Resources/Licenses/JetBrainsMono-OFL.txt
        buildPhase: resources
      - path: Resources/Licenses/NerdFonts-LICENSE.txt
        buildPhase: resources
    dependencies:
      - package: AlasCore
        product: AlasRemoteKit
      - package: AlasCore
        product: AlasHighlight
      - package: Markdown
        product: Markdown
      - package: SwiftTerm
        product: SwiftTerm
      - package: BeautifulMermaidSwift
        product: BeautifulMermaid
      - target: AlasNotificationService
        embed: true
    settings:
      base:
        PRODUCT_NAME: Alas
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Rust grammar pack is built arm64-only for the phone.
        ARCHS[sdk=iphonesimulator*]: arm64
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/../.build/treesitter-pack/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/../.build/treesitter-pack/$(PLATFORM_NAME)-arm64/install/lib
        OTHER_LDFLAGS: $(inherited) -lalas_treesitter_pack
    preBuildScripts:
      # The script resolves the crate under SRCROOT, which must be the repo root.
      - name: Build TreeSitter Pack
        script: 'SRCROOT="${SRCROOT}/.." "${SRCROOT}/../scripts/build-treesitter-pack.sh"'
        basedOnDependencyAnalysis: false
    entitlements:
      path: AlasMobile.entitlements
      properties:
        aps-environment: $(ALAS_APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - $(ALAS_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER).shared
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: $(ALAS_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only TLS and signing (CryptoKit/swift-crypto): exempt, so uploads skip the compliance question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The iPad turns freely, as split view and Stage Manager expect.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Alas connects to your Macs on this network.
        NSCameraUsageDescription: Scan a pairing code from your Mac, and take photos to attach to a prompt.
        UIBackgroundModes:
          - remote-notification
        AlasPushRelayURL: $(ALAS_PUSH_RELAY_URL)
        AlasPushEnvironment: $(ALAS_APS_ENVIRONMENT)
        AlasAppGroup: $(ALAS_APP_GROUP)
        AlasKeychainGroup: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER).shared

  AlasNotificationService:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: ../Config/AlasMobile-Debug.xcconfig
      Release: ../Config/AlasMobile-Release.xcconfig
    sources:
      - path: NotificationService
      - path: Sources/Hosts/HostStore.swift
      - path: Sources/Hosts/PhoneProtocol.swift
    dependencies:
      - package: AlasCore
        product: AlasRemoteKit
    settings:
      base:
        PRODUCT_NAME: AlasNotificationService
        PRODUCT_BUNDLE_IDENTIFIER: $(ALAS_APP_BUNDLE_ID).NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    # Reads the app's shared storage, so it carries the app's group ids.
    entitlements:
      path: NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - $(ALAS_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(ALAS_APP_BUNDLE_ID).shared
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: $(ALAS_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        AlasAppGroup: $(ALAS_APP_GROUP)
        AlasKeychainGroup: $(AppIdentifierPrefix)$(ALAS_APP_BUNDLE_ID).shared
        # Same as the app: hosts are reached over ws:// at any origin, including tailnet hostnames.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

schemes:
  AlasMobile:
    build:
      targets:
        AlasMobile: all
    run:
      config: Debug
      # Scenario drivers for the transcript spike; enable per scenario in the scheme editor.
      # Profile inherits these.
      commandLineArguments:
        "-spikePreloadPages 23": false
        "-spikeWindowSize 20": false
