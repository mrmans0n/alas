name: Alas
options:
  bundleIdPrefix: io.nlopez
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO

targets:
  Alas:
    type: application
    platform: macOS
    sources:
      - path: Alas/Sources
      - path: Alas/Resources/Themes
        buildPhase: resources
      # HookInstaller loads these via Bundle.main; they MUST land in the app
      # bundle, otherwise harness install fails with "Bundled hook script
      # missing" at runtime. The top-level `resources:` key xcodegen used to
      # support is ignored on the version we're on, so add via `sources` +
      # explicit buildPhase instead.
      - path: Alas/Resources/HookScripts
        buildPhase: resources
      - path: Alas/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Alas/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "0.5.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 Nacho Lopez"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
    dependencies:
      - framework: .build/ghostty/GhosttyKit.xcframework
        embed: false
        link: true
        codeSign: false
      - sdk: Carbon.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nlopez.alas
        PRODUCT_NAME: Alas
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        OTHER_LDFLAGS: $(inherited) -lc++
    preBuildScripts:
      - name: Build GhosttyKit
        script: '"${SRCROOT}/scripts/build-ghostty.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed Ghostty Resources
        script: '"${SRCROOT}/scripts/embed-ghostty-resources.sh"'
        basedOnDependencyAnalysis: false
    entitlements:
      path: Alas/Resources/Alas.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true

  AlasTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AlasTests
    dependencies:
      - target: Alas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nlopez.alas.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Alas.app/Contents/MacOS/Alas
        BUNDLE_LOADER: $(TEST_HOST)
