name: Alas
options:
  bundleIdPrefix: io.nlopez
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_APPINTENTS_METADATA_EXTRACTION: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO

packages:
  AlasCore:
    path: Packages/AlasCore
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.6
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.5
  # Only the tree-sitter *runtime* and Swift API come from SwiftPM. The
  # grammars themselves live in ThirdParty/treesitter-pack, a Rust staticlib
  # that depends on them via cargo and exposes languages + highlight queries
  # over a small C ABI (see scripts/build-treesitter-pack.sh).
  SwiftTreeSitter:
    url: https://github.com/tree-sitter/swift-tree-sitter
    exactVersion: 0.25.0
  Markdown:
    url: https://github.com/apple/swift-markdown
    from: 0.9.0
  BeautifulMermaidSwift:
    url: https://github.com/lukilabs/beautiful-mermaid-swift
    from: 1.0.4
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    exactVersion: 4.6.1

targets:
  Alas:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Alas-Debug.xcconfig
      Release: Config/Alas-Release.xcconfig
    sources:
      - path: Alas/Sources
        excludes:
          - "ComputerUseKit/**"
          - "VMGuest/**"
      - path: Alas/Resources/Themes
        buildPhase: resources
      - path: Alas/Resources/CodeThemes
        buildPhase: resources
      - path: Alas/Resources/Assets.xcassets
        buildPhase: resources
      - path: ThirdParty/ghostty/src/font/res/JetBrainsMonoNerdFont-Regular.ttf
        buildPhase: resources
        optional: true
      - path: Alas/Resources/mason-lsps.json
        buildPhase: resources
      - path: Alas/Resources/Lottie
        buildPhase: resources
      - path: Alas/Resources/MCPLogo-LICENSE.txt
        buildPhase: resources
      - path: Alas/Resources/LocalTextModelLicenses.txt
        buildPhase: resources
      - path: Alas/Resources/LocalTextModelManifest.json
        buildPhase: resources
      - path: Alas/Resources/RemoteWeb
        buildPhase: resources
        type: folder
      - path: Alas/Resources/VisualAid
        buildPhase: resources
        type: folder
      - path: Alas/Resources/WhatsNew
        buildPhase: resources
        type: folder
      # Next to the embedded Alas VM Guest.app, which it installs inside a VM.
      - path: "Alas/Resources/VMGuest/Install Alas VM Guest.command"
        buildPhase:
          copyFiles:
            destination: resources
            subpath: alas-vm-guest
    info:
      path: Alas/Resources/Info.plist
      properties:
        AlasBuildDate: ""
        AlasBuildConfiguration: "$(CONFIGURATION)"
        AlasGitSHA: ""
        AlasReleaseTrack: stable
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "0.22.3"
        CFBundleVersion: "1"
        CFBundleName: "$(ALAS_DISPLAY_NAME)"
        CFBundleDisplayName: "$(ALAS_DISPLAY_NAME)"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright © 2026 Nacho Lopez"
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: "Alas uses the microphone to dictate text into the chat composer."
        NSSpeechRecognitionUsageDescription: "Alas uses on-device speech recognition to transcribe dictated text into the chat composer."
        NSLocalNetworkUsageDescription: "Alas uses the local network to find and pair with other Macs running Alas."
        NSBonjourServices:
          - _alas._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
    dependencies:
      - framework: .build/ghostty/GhosttyKit.xcframework
        embed: false
        link: true
        codeSign: false
      - sdk: AppIntents.framework
      - sdk: Carbon.framework
      - sdk: libsqlite3.tbd
      - package: AlasCore
        product: AlasCore
      # Static, so AlasCore is linked once (into the app), not into a dylib as well.
      # Its archive also holds AlasCore's objects: never link it with -all_load, -ObjC or
      # -force_load, or those symbols are duplicated.
      - target: AlasComputerUseKit
        link: true
        embed: false
      # The helper app a worktree VM runs; the install script next to it sets it up there.
      - target: AlasVMGuest
        embed: true
        codeSign: false
        copy:
          destination: resources
          subpath: alas-vm-guest
      # The headless host, built against the same AlasCore the app links,
      # so it costs its own sources only. Inside the bundle it finds the
      # web client at ../RemoteWeb.
      - target: AlasHost
        embed: true
        codeSign: false
        copy:
          destination: resources
          subpath: alas-host
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: SwiftTreeSitter
        product: SwiftTreeSitter
      - package: Markdown
        product: Markdown
      - package: BeautifulMermaidSwift
        product: BeautifulMermaid
      - package: Lottie
        product: Lottie
    settings:
      base:
        ARCHS: $(ALAS_APP_ARCHS)
        ALAS_APP_ARCHS: $(ARCHS_STANDARD)
        PRODUCT_NAME: Alas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/.build/fff/include $(SRCROOT)/.build/treesitter-pack/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/.build/fff/$(CURRENT_ARCH)/install/lib $(SRCROOT)/.build/fff/universal/install/lib $(SRCROOT)/.build/treesitter-pack/$(CURRENT_ARCH)/install/lib $(SRCROOT)/.build/treesitter-pack/universal/install/lib
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        # Ghostty's archive goes first: since Zig 0.17 its bundled compiler-rt
        # symbols are no longer weak, so if the Rust grammar pack's copies of
        # __mulsc3/__divsc3 load first, ld reports duplicate symbols.
        OTHER_LDFLAGS: $(inherited) -lc++ $(SRCROOT)/.build/ghostty/GhosttyKit.xcframework/macos-arm64_x86_64/ghostty-internal.a -lfff_c -lalas_treesitter_pack
    preBuildScripts:
      - name: Build GhosttyKit
        script: '"${SRCROOT}/scripts/build-ghostty.sh"'
        basedOnDependencyAnalysis: false
      - name: Build zmx
        script: '"${SRCROOT}/scripts/build-zmx.sh"'
        basedOnDependencyAnalysis: false
      - name: Build Alas Helper
        script: '"${SRCROOT}/scripts/build-alas-helper.sh"'
        basedOnDependencyAnalysis: false
      - name: Build Alas CLI
        script: '"${SRCROOT}/scripts/build-alas-cli.sh"'
        basedOnDependencyAnalysis: false
      - name: Build fff
        script: '"${SRCROOT}/scripts/build-fff.sh"'
        basedOnDependencyAnalysis: false
      - name: Build TreeSitter Pack
        script: '"${SRCROOT}/scripts/build-treesitter-pack.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed Ghostty Resources
        script: '"${SRCROOT}/scripts/embed-ghostty-resources.sh"'
        basedOnDependencyAnalysis: false
    entitlements:
      path: Alas/Resources/Alas.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.virtualization: true

  AlasHost:
    type: tool
    platform: macOS
    sources:
      - path: Packages/AlasCore/Sources/alas-host
    dependencies:
      - package: AlasCore
        product: AlasCore
    settings:
      base:
        ARCHS: $(ALAS_APP_ARCHS)
        ALAS_APP_ARCHS: $(ARCHS_STANDARD)
        PRODUCT_NAME: alas-host
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES

  # The computer-use executor and coordinator, shared by the app and the VM guest helper.
  # Linked by both alongside the AlasCore package, without -all_load, -ObjC or -force_load:
  # the archive holds AlasCore's objects too, and forcing them in duplicates symbols.
  AlasComputerUseKit:
    type: framework.static
    platform: macOS
    sources:
      - path: Alas/Sources/ComputerUseKit
    dependencies:
      - package: AlasCore
        product: AlasCore
    settings:
      base:
        ARCHS: $(ALAS_APP_ARCHS)
        ALAS_APP_ARCHS: $(ARCHS_STANDARD)
        PRODUCT_NAME: AlasComputerUseKit
        PRODUCT_BUNDLE_IDENTIFIER: io.nlopez.alas.computerusekit
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES

  # Alas VM Guest: performs computer-use calls and vm_run commands inside a worktree VM.
  # Depends on the kit and AlasCore directly; no -all_load, -ObjC or -force_load (the kit's
  # archive also holds AlasCore's objects, so forcing them in duplicates symbols).
  AlasVMGuest:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/AlasVMGuest-Debug.xcconfig
      Release: Config/AlasVMGuest-Release.xcconfig
    sources:
      - path: Alas/Sources/VMGuest
    info:
      path: Alas/Resources/VMGuest/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleName: "Alas VM Guest"
        CFBundleDisplayName: "Alas VM Guest"
        # Its own version, so release bumps keep editing one CFBundleShortVersionString.
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 Nacho Lopez"
    dependencies:
      - target: AlasComputerUseKit
        link: true
        embed: false
      - package: AlasCore
        product: AlasCore
    settings:
      base:
        ARCHS: $(ALAS_APP_ARCHS)
        ALAS_APP_ARCHS: $(ARCHS_STANDARD)
        PRODUCT_NAME: "Alas VM Guest"
        PRODUCT_BUNDLE_IDENTIFIER: io.nlopez.vmguest
        ENABLE_HARDENED_RUNTIME: YES
        # One self-contained binary to copy into a VM, in Debug too.
        ENABLE_DEBUG_DYLIB: NO
        SKIP_INSTALL: YES

  AlasTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/AlasTests-Debug.xcconfig
    sources:
      - path: AlasTests
    dependencies:
      - target: Alas
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nlopez.alas.tests
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/.build/fff/include $(SRCROOT)/.build/treesitter-pack/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/.build/fff/$(CURRENT_ARCH)/install/lib $(SRCROOT)/.build/fff/universal/install/lib $(SRCROOT)/.build/treesitter-pack/$(CURRENT_ARCH)/install/lib $(SRCROOT)/.build/treesitter-pack/universal/install/lib
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @loader_path/../Frameworks @executable_path/../Frameworks
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Alas.app/Contents/MacOS/Alas
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Alas:
    build:
      targets:
        Alas: all
        AlasTests: [test]
    run:
      config: Debug
      executable: Alas
    test:
      config: Debug
      commandLineArguments:
        "--no-parallel": true
      # Tests run under an isolated profile so nothing reads or locks the
      # developer's real app-support files (workspaces.json, sockets, prefs).
      # The leaf must stay named "Alas"; PathsTests checks it.
      environmentVariables:
        ALAS_APP_SUPPORT_DIR: /tmp/alas-tests/Alas
      targets:
        - name: AlasTests
          parallelizable: false
