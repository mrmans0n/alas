name: Alas
options:
  bundleIdPrefix: io.nlopez
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_APPINTENTS_METADATA_EXTRACTION: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO

packages:
  SwiftTreeSitter:
    url: https://github.com/tree-sitter/swift-tree-sitter
    from: 0.25.0
  TreeSitterSwift:
    url: https://github.com/alex-pinkus/tree-sitter-swift
    # tag 0.7.2-with-generated-files; this fork's `main` branch
    # gitignores generated parser files, so SPM consumers must
    # pin to a `*-with-generated-files` revision.
    revision: 7b7909f2f6b9414be0958275f4c8e5d69c3bca43
  Markdown:
    url: https://github.com/apple/swift-markdown
    from: 0.4.0

targets:
  Alas:
    type: application
    platform: macOS
    sources:
      - path: Alas/Sources
      - path: Alas/Resources/Themes
        buildPhase: resources
      - path: Alas/Resources/Assets.xcassets
        buildPhase: resources
      - path: ThirdParty/ghostty/src/font/res/JetBrainsMonoNerdFont-Regular.ttf
        buildPhase: resources
        optional: true
      - path: Alas/Resources/mason-lsps.json
        buildPhase: resources
    info:
      path: Alas/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "0.3.11"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 Nacho Lopez"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
    dependencies:
      - framework: $(SRCROOT)/.build/ghostty/GhosttyKit.xcframework
        embed: false
        link: true
        codeSign: false
      - sdk: AppIntents.framework
      - sdk: Carbon.framework
      - package: SwiftTreeSitter
        product: SwiftTreeSitter
      - package: TreeSitterSwift
        product: TreeSitterSwift
      - package: Markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nlopez.alas
        PRODUCT_NAME: Alas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        OTHER_LDFLAGS: $(inherited) -lc++
    preBuildScripts:
      - name: Build GhosttyKit
        script: '"${SRCROOT}/scripts/build-ghostty.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed Ghostty Resources
        script: '"${SRCROOT}/scripts/embed-ghostty-resources.sh"'
        basedOnDependencyAnalysis: false
    entitlements:
      path: Alas/Resources/Alas.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true

  AlasTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AlasTests
    dependencies:
      - target: Alas
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nlopez.alas.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Alas.app/Contents/MacOS/Alas
        BUNDLE_LOADER: $(TEST_HOST)
