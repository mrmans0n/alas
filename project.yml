name: Alas
options:
  bundleIdPrefix: io.nlopez
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_APPINTENTS_METADATA_EXTRACTION: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO

packages:
  SwiftTreeSitter:
    url: https://github.com/tree-sitter/swift-tree-sitter
    from: 0.25.0
  TreeSitterSwift:
    url: https://github.com/alex-pinkus/tree-sitter-swift
    # tag 0.7.3-with-generated-files; this fork's `main` branch
    # gitignores generated parser files, so SPM consumers must
    # pin to a `*-with-generated-files` revision.
    revision: 31d17fe7e818a2048c808b5c6fdc2dc792f4f5b5
  TreeSitterYAML:
    # Vendored at ThirdParty/TreeSitterYAML — upstream's Package.swift
    # conditionally adds src/scanner.c via a relative-path FileManager
    # check that returns false during SPM resolution, dropping the
    # external scanner and breaking the link.
    path: ThirdParty/TreeSitterYAML
  TreeSitterJSON:
    url: https://github.com/tree-sitter/tree-sitter-json
    from: 0.24.8
  TreeSitterTOML:
    url: https://github.com/tree-sitter-grammars/tree-sitter-toml
    from: 0.7.0
  TreeSitterPython:
    # Vendored at ThirdParty/TreeSitterPython — upstream's Package.swift
    # has the same broken `FileManager.fileExists` scanner conditional
    # as tree-sitter-yaml.
    path: ThirdParty/TreeSitterPython
  TreeSitterRuby:
    url: https://github.com/tree-sitter/tree-sitter-ruby
    from: 0.23.1
  TreeSitterLua:
    # Vendored at ThirdParty/TreeSitterLua — upstream's Package.swift
    # has the same broken `FileManager.fileExists` scanner conditional
    # as tree-sitter-yaml.
    path: ThirdParty/TreeSitterLua
  TreeSitterRust:
    url: https://github.com/tree-sitter/tree-sitter-rust
    from: 0.24.2
  TreeSitterGo:
    url: https://github.com/tree-sitter/tree-sitter-go
    from: 0.25.0
  TreeSitterBash:
    url: https://github.com/tree-sitter/tree-sitter-bash
    from: 0.25.1
  TreeSitterJavaScript:
    # Vendored at ThirdParty/TreeSitterJavaScript — upstream's Package.swift
    # has the same broken `FileManager.fileExists` scanner conditional as
    # tree-sitter-yaml.
    path: ThirdParty/TreeSitterJavaScript
  TreeSitterTypeScript:
    # Single package, two targets (TreeSitterTypeScript for .ts,
    # TreeSitterTSX for .tsx). The umbrella product pulls in both.
    url: https://github.com/tree-sitter/tree-sitter-typescript
    from: 0.23.2
  TreeSitterJava:
    url: https://github.com/tree-sitter/tree-sitter-java
    from: 0.23.5
  TreeSitterKotlin:
    url: https://github.com/fwcd/tree-sitter-kotlin
    from: 0.3.8
  TreeSitterC:
    url: https://github.com/tree-sitter/tree-sitter-c
    from: 0.24.2
  TreeSitterCPP:
    url: https://github.com/tree-sitter/tree-sitter-cpp
    from: 0.23.4
  TreeSitterHTML:
    url: https://github.com/tree-sitter/tree-sitter-html
    from: 0.23.2
  TreeSitterCSS:
    # Vendored at ThirdParty/TreeSitterCSS — upstream's Package.swift
    # has the same broken `FileManager.fileExists` scanner conditional
    # as tree-sitter-yaml.
    path: ThirdParty/TreeSitterCSS
  TreeSitterPHP:
    url: https://github.com/tree-sitter/tree-sitter-php
    from: 0.24.2
  TreeSitterMarkdown:
    url: https://github.com/tree-sitter-grammars/tree-sitter-markdown
    from: 0.5.3
  TreeSitterHCL:
    # Vendored at ThirdParty/TreeSitterHCL — upstream's Package.swift
    # does not include query resources.
    path: ThirdParty/TreeSitterHCL
  TreeSitterDockerfile:
    url: https://github.com/camdencheek/tree-sitter-dockerfile
    from: 0.2.0
  Markdown:
    url: https://github.com/apple/swift-markdown
    from: 0.8.0

targets:
  Alas:
    type: application
    platform: macOS
    sources:
      - path: Alas/Sources
      - path: Alas/Resources/Themes
        buildPhase: resources
      - path: Alas/Resources/Assets.xcassets
        buildPhase: resources
      - path: ThirdParty/ghostty/src/font/res/JetBrainsMonoNerdFont-Regular.ttf
        buildPhase: resources
        optional: true
      - path: Alas/Resources/mason-lsps.json
        buildPhase: resources
      - path: Alas/Resources/RemoteWeb
        buildPhase: resources
        type: folder
    info:
      path: Alas/Resources/Info.plist
      properties:
        AlasBuildDate: ""
        AlasGitSHA: ""
        AlasReleaseTrack: stable
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "0.12.7"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright © 2026 Nacho Lopez"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
    dependencies:
      - framework: .build/ghostty/GhosttyKit.xcframework
        embed: false
        link: true
        codeSign: false
      - sdk: AppIntents.framework
      - sdk: Carbon.framework
      - sdk: libsqlite3.tbd
      - package: SwiftTreeSitter
        product: SwiftTreeSitter
      - package: TreeSitterSwift
        product: TreeSitterSwift
      - package: TreeSitterYAML
        product: TreeSitterYAML
      - package: TreeSitterJSON
        product: TreeSitterJSON
      - package: TreeSitterTOML
        product: TreeSitterTOML
      - package: TreeSitterPython
        product: TreeSitterPython
      - package: TreeSitterRuby
        product: TreeSitterRuby
      - package: TreeSitterLua
        product: TreeSitterLua
      - package: TreeSitterRust
        product: TreeSitterRust
      - package: TreeSitterGo
        product: TreeSitterGo
      - package: TreeSitterBash
        product: TreeSitterBash
      - package: TreeSitterJavaScript
        product: TreeSitterJavaScript
      - package: TreeSitterTypeScript
        product: TreeSitterTypeScript
      - package: TreeSitterJava
        product: TreeSitterJava
      - package: TreeSitterKotlin
        product: TreeSitterKotlin
      - package: TreeSitterC
        product: TreeSitterC
      - package: TreeSitterCPP
        product: TreeSitterCPP
      - package: TreeSitterHTML
        product: TreeSitterHTML
      - package: TreeSitterCSS
        product: TreeSitterCSS
      - package: TreeSitterPHP
        product: TreeSitterPHP
      - package: TreeSitterMarkdown
        product: TreeSitterMarkdown
      - package: TreeSitterHCL
        product: TreeSitterHCL
      - package: TreeSitterDockerfile
        product: TreeSitterDockerfile
      - package: Markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nlopez.alas
        PRODUCT_NAME: Alas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/.build/fff/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/.build/fff/$(CURRENT_ARCH)/install/lib $(SRCROOT)/.build/fff/universal/install/lib
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        OTHER_LDFLAGS: $(inherited) -lc++ -lfff_c
    preBuildScripts:
      - name: Build GhosttyKit
        script: '"${SRCROOT}/scripts/build-ghostty.sh"'
        basedOnDependencyAnalysis: false
      - name: Build zmx
        script: '"${SRCROOT}/scripts/build-zmx.sh"'
        basedOnDependencyAnalysis: false
      - name: Build Alas Helper
        script: '"${SRCROOT}/scripts/build-alas-helper.sh"'
        basedOnDependencyAnalysis: false
      - name: Build Alas CLI
        script: '"${SRCROOT}/scripts/build-alas-cli.sh"'
        basedOnDependencyAnalysis: false
      - name: Build fff
        script: '"${SRCROOT}/scripts/build-fff.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed Ghostty Resources
        script: '"${SRCROOT}/scripts/embed-ghostty-resources.sh"'
        basedOnDependencyAnalysis: false
    entitlements:
      path: Alas/Resources/Alas.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true

  AlasTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AlasTests
    dependencies:
      - target: Alas
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nlopez.alas.tests
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/.build/fff/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/.build/fff/$(CURRENT_ARCH)/install/lib $(SRCROOT)/.build/fff/universal/install/lib
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @loader_path/../Frameworks @executable_path/../Frameworks
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Alas.app/Contents/MacOS/Alas
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Alas:
    build:
      targets:
        Alas: all
        AlasTests: [test]
    run:
      config: Debug
      executable: Alas
    test:
      config: Debug
      commandLineArguments:
        "--no-parallel": true
      targets:
        - name: AlasTests
          parallelizable: false
