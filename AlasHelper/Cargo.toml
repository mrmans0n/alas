[package]
name = "alas-helper"
version = "0.10.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23"
libc = "0.2"
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.41", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
